<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insolvenční zákon v praxi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Paleta navazuje na tréninkovou appku (papír, inkoust, pečeť), aby to
     byl zjevně tentýž produkt. Přibyla jedna barva navíc: rozhovor.
     Zákon a výklad jsou teplé, dotazy na Claudea studené — ať je na první
     pohled poznat, kde končí předpis a kde začíná debata o něm. */
  :root {
    --papir: #FBF9F6;
    --plocha: #FFFFFF;
    --vyklad-plocha: #F3EEE7;
    --inkoust: #1A1714;
    --tlum: #857A70;
    --linka: #E5DED5;
    --pecet: #A85430;
    --rozhovor: #3A5876;
    --rozhovor-plocha: #EDF1F5;
    --stin: 0 1px 2px rgba(26, 23, 20, .06);
    /* Jen pro hru: lhůty, které se blíží, a hodnocení voleb. */
    --hra-pozor: #9A6512;
    --hra-kriticke: #B3261E;
    --hra-dobre: #3D7A4C;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papir: #17150F;
      --plocha: #1F1C17;
      --vyklad-plocha: #252119;
      --inkoust: #EDE7DC;
      --tlum: #9A9084;
      --linka: #332F27;
      --pecet: #DC9068;
      --rozhovor: #9DBDDC;
      --rozhovor-plocha: #1C222A;
      --stin: none;
      --hra-pozor: #E0B062;
      --hra-kriticke: #F08A80;
      --hra-dobre: #8CC79B;
    }
  }
  :root[data-theme="dark"] {
    --papir: #17150F;
    --plocha: #1F1C17;
    --vyklad-plocha: #252119;
    --inkoust: #EDE7DC;
    --tlum: #9A9084;
    --linka: #332F27;
    --pecet: #DC9068;
    --rozhovor: #9DBDDC;
    --rozhovor-plocha: #1C222A;
    --stin: none;
    --hra-pozor: #E0B062;
    --hra-kriticke: #F08A80;
    --hra-dobre: #8CC79B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papir);
    color: var(--inkoust);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .obal { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ---- horní lišta ---------------------------------------------------- */
  .lista {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--papir);
    background: color-mix(in srgb, var(--papir) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linka);
    margin: 0 -1.25rem 1.5rem;
    padding: .7rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .zpet {
    appearance: none;
    border: 0;
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
    padding: .35rem 0;
  }
  .zpet:hover { color: var(--inkoust); }
  .lista-nazev {
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .lista-stav { margin-left: auto; font-size: .8rem; color: var(--tlum); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tisk-tlacitko {
    appearance: none;
    border: 1px solid var(--linka);
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .82rem;
    border-radius: 999px;
    padding: .25rem .75rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .lista-stav + .tisk-tlacitko { margin-left: .5rem; }
  .tisk-tlacitko:hover { color: var(--inkoust); border-color: var(--tlum); }
  .tisk-tlacitko:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }

  .tisk-panel {
    border: 1px solid var(--linka);
    background: var(--plocha);
    border-radius: .75rem;
    padding: 1rem 1.1rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--stin);
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  .tisk-panel .stitek { margin-bottom: .1rem; }
  .tisk-volba {
    display: flex;
    align-items: baseline;
    gap: .55rem;
    font-size: .93rem;
    cursor: pointer;
  }
  .tisk-volba input { margin: 0; accent-color: var(--pecet); }
  .tisk-volba .kolik { color: var(--tlum); font-size: .84rem; }
  .tisk-akce { display: flex; gap: .5rem; align-items: center; margin-top: .35rem; }
  .tisk-akce .poslat { background: var(--pecet); }

  /* ---- obsah ---------------------------------------------------------- */
  .titul {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.12;
    text-wrap: balance;
    margin: .5rem 0 .6rem;
  }
  .perex { color: var(--tlum); font-size: .98rem; max-width: 38rem; margin: 0 0 1.5rem; }

  .hledani {
    width: 100%;
    font: inherit;
    color: var(--inkoust);
    background: var(--plocha);
    border: 1px solid var(--linka);
    border-radius: .65rem;
    padding: .7rem .9rem;
    box-shadow: var(--stin);
  }
  .hledani::placeholder { color: var(--tlum); }
  .hledani:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }

  .cast {
    margin: 2.2rem 0 .3rem;
    font-size: .74rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--pecet);
  }
  .hlava { margin: 1.2rem 0 .2rem; font-size: .85rem; color: var(--tlum); }

  .radek {
    display: grid;
    grid-template-columns: 3.4rem 1fr auto;
    align-items: baseline;
    gap: .8rem;
    width: 100%;
    text-align: left;
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--linka);
    background: none;
    color: inherit;
    font: inherit;
    padding: .7rem .25rem;
    cursor: pointer;
  }
  .radek:hover { background: var(--plocha); }
  .radek:focus-visible { outline: 2px solid var(--pecet); outline-offset: -2px; }
  .radek-cislo { font-weight: 600; color: var(--pecet); font-variant-numeric: tabular-nums; }
  .radek-nazev { font-size: .95rem; }
  .radek-znacka { font-size: .7rem; color: var(--linka); line-height: 1; }
  .radek-znacka.hotovo { color: var(--pecet); }
  .radek-znacka.castecne { color: var(--tlum); }

  .radek-tema { grid-template-columns: 1fr auto; }
  .radek-vlakno { grid-template-columns: 1fr auto; align-items: center; }
  .vlakno-nazev { display: block; font-size: .95rem; }
  .vlakno-kde {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: .15rem;
    font-size: .78rem;
    color: var(--tlum);
  }
  .radek-pramen { font-size: .78rem; color: var(--tlum); white-space: nowrap; }
  .bod-nadpis {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.22rem;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 .1rem;
  }

  /* ---- přehled pohledávek --------------------------------------------- */
  .radek-prehled { border-bottom-color: var(--pecet); }

  .osy { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 1.2rem; }
  .osa {
    appearance: none;
    border: 1px solid var(--linka);
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .88rem;
    border-radius: 999px;
    padding: .4rem .9rem;
    cursor: pointer;
  }
  .osa:hover { color: var(--inkoust); }
  .osa-vybrana {
    border-color: var(--pecet);
    background: var(--pecet);
    color: var(--papir);
  }
  .osa:focus-visible { outline: 2px solid var(--pecet); outline-offset: 2px; }
  .osa-perex { color: var(--tlum); font-size: .95rem; margin: 0 0 1.5rem; }

  .kolej { margin-bottom: 2.2rem; }
  .kolej-nazev {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 .2rem;
  }
  .kolej-popis { color: var(--tlum); font-size: .88rem; margin: 0 0 .9rem; }
  .kolej-cislo {
    font-size: .75rem;
    font-weight: 600;
    color: var(--pecet);
    font-variant-numeric: tabular-nums;
    margin-top: .6rem;
  }

  .typ {
    border: 1px solid var(--linka);
    border-radius: .7rem;
    margin-bottom: .55rem;
    background: var(--plocha);
    overflow: hidden;
  }
  .typ-otevreny { border-color: var(--pecet); }
  .typ-hlava {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .9rem;
    width: 100%;
    text-align: left;
    appearance: none;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    padding: .8rem .9rem;
    cursor: pointer;
  }
  .typ-hlava:hover { background: var(--vyklad-plocha); }
  .typ-hlava:focus-visible { outline: 2px solid var(--pecet); outline-offset: -2px; }
  .typ-nazev { display: block; font-size: 1rem; font-weight: 600; }
  .typ-zkratka { display: block; margin-top: .15rem; font-size: .85rem; color: var(--tlum); }
  .typ-pramen { font-size: .76rem; color: var(--pecet); white-space: nowrap; }
  .typ-telo { padding: 0 .9rem 1rem; border-top: 1px solid var(--linka); }
  .typ-telo > p { font-size: .95rem; }
  .typ-telo > p:first-child { margin-top: .9rem; }
  .typ-pozor {
    margin-top: .9rem;
    padding: .8rem .9rem;
    border-radius: .6rem;
    background: var(--vyklad-plocha);
  }
  .typ-pozor p { font-size: .93rem; margin: 0 0 .7rem; }
  .typ-pozor p:last-child { margin-bottom: 0; }

  .cviceni { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--linka); }
  .uloha { margin-bottom: 1.4rem; }
  .uloha-zadani {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.02rem;
    line-height: 1.45;
    margin: 0 0 .5rem;
  }
  .uloha-reseni {
    border-left: 2px solid var(--pecet);
    padding-left: .9rem;
  }
  .uloha-typ {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--pecet);
    margin-bottom: .35rem;
  }
  .uloha-reseni p { font-size: .93rem; margin: 0; }

  /* ---- přehled lhůt ---------------------------------------------------- */
  /* Barva nese následek zmeškání — to je u lhůt jediná informace, která se
     musí dát přečíst bez čtení. Zánik práva červeně, zbytek tlumeně. */
  :root {
    --n-prekluze: #B4453A;
    --n-povinnost: #A85430;
    --n-poradkova: #857A70;
    --n-hmotne: #3A5876;
    --n-jine: #8A8078;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --n-prekluze: #E07A6C; --n-povinnost: #DC9068; --n-poradkova: #9A9084;
      --n-hmotne: #9DBDDC; --n-jine: #9A9084;
    }
  }
  :root[data-theme="dark"] {
    --n-prekluze: #E07A6C; --n-povinnost: #DC9068; --n-poradkova: #9A9084;
    --n-hmotne: #9DBDDC; --n-jine: #9A9084;
  }

  .legenda { margin-top: 1rem; display: flex; flex-direction: column; gap: .4rem; }
  .legenda-radek { display: flex; align-items: baseline; gap: .55rem; font-size: .88rem; }
  .znacka-nasledku {
    flex: none;
    width: .6rem;
    height: .6rem;
    border-radius: 2px;
    background: var(--n-jine);
  }
  .n-prekluze .znacka-nasledku, .znacka-nasledku.n-prekluze { background: var(--n-prekluze); }
  .znacka-nasledku.n-povinnost { background: var(--n-povinnost); }
  .znacka-nasledku.n-poradkova { background: var(--n-poradkova); }
  .znacka-nasledku.n-hmotne { background: var(--n-hmotne); }

  .lhuta {
    border-left: 3px solid var(--n-jine);
    padding: .7rem 0 .7rem .85rem;
    margin-bottom: .2rem;
    border-bottom: 1px solid var(--linka);
  }
  .lhuta.n-prekluze { border-left-color: var(--n-prekluze); }
  .lhuta.n-povinnost { border-left-color: var(--n-povinnost); }
  .lhuta.n-poradkova { border-left-color: var(--n-poradkova); }
  .lhuta.n-hmotne { border-left-color: var(--n-hmotne); }

  .lhuta-hlava {
    display: grid;
    grid-template-columns: 6.5rem 1fr auto;
    gap: .25rem .8rem;
    align-items: baseline;
  }
  @media (max-width: 34rem) {
    .lhuta-hlava { grid-template-columns: 1fr auto; }
    .lhuta-delka { grid-column: 1 / -1; }
  }
  .lhuta-delka {
    font-size: 1rem;
    font-weight: 600;
    color: var(--inkoust);
    font-variant-numeric: tabular-nums;
  }
  .lhuta-stred { min-width: 0; }
  .lhuta-co { display: block; font-size: .95rem; }
  .lhuta-odkdy { display: block; margin-top: .1rem; font-size: .8rem; color: var(--tlum); }
  .lhuta-paticka { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .nasledek-stitek, .kdo-stitek {
    font-size: .72rem;
    border-radius: 999px;
    padding: .12rem .5rem;
    border: 1px solid var(--linka);
    color: var(--tlum);
  }
  .nasledek-stitek { border-color: currentColor; }
  .nasledek-stitek.n-prekluze { color: var(--n-prekluze); }
  .nasledek-stitek.n-povinnost { color: var(--n-povinnost); }
  .nasledek-stitek.n-poradkova { color: var(--n-poradkova); }
  .nasledek-stitek.n-hmotne { color: var(--n-hmotne); }
  .lhuta-pozn { margin-top: .5rem; }
  .lhuta-pozn p { margin: 0; font-size: .87rem; color: var(--tlum); }

  /* ---- paragraf ------------------------------------------------------- */
  .p-cislo {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--pecet);
    font-variant-numeric: tabular-nums;
  }
  .p-nazev {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.15;
    text-wrap: balance;
    margin: .25rem 0 .5rem;
  }
  .drobecky { font-size: .8rem; color: var(--tlum); margin: 0 0 2rem; }

  .odstavec { margin-bottom: 2.5rem; }

  /* Znění zákona patkově, všechno ostatní bezpatkově — typografie sama
     říká, kde mluví předpis a kde už někdo o předpisu. */
  .zneni {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.06rem;
    line-height: 1.6;
    white-space: pre-line;
    margin: 0;
  }
  .zneni-cislo { font-weight: 600; color: var(--pecet); font-family: "IBM Plex Sans", sans-serif; font-size: .95rem; }

  .vyklad {
    margin-top: 1rem;
    background: var(--vyklad-plocha);
    border-radius: .75rem;
    padding: 1.1rem 1.15rem;
  }
  .stitek {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--pecet);
    margin-bottom: .6rem;
  }
  .vyklad p { margin: 0 0 .8rem; font-size: .96rem; }
  .vyklad p:last-child { margin-bottom: 0; }
  .vyklad strong { font-weight: 600; }
  .chybi { margin-top: .9rem; font-size: .88rem; color: var(--tlum); font-style: italic; }

  /* ---- rozhovor ------------------------------------------------------- */
  /* Panel stojí na širokém displeji vedle textu, aby znění zákona zůstalo
     vidět, a na telefonu přes celou obrazovku, kde by sloupec neměl smysl. */
  .panel {
    position: fixed;
    z-index: 20;
    top: 0; right: 0; bottom: 0; left: 0;
    inset: 0;
    background: var(--plocha);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--linka);
  }
  .panel-zaves { display: none; }

  @media (min-width: 62rem) {
    .panel {
      top: 0; right: 0; bottom: 0; left: auto;
      inset: 0 0 0 auto;
      width: 25rem;
      box-shadow: -1px 0 0 var(--linka), -24px 0 48px rgba(26, 23, 20, .06);
    }
    body.s-panelem .obal { margin-right: 25rem; }
  }
  @media (max-width: 61.99rem) {
    .panel-zaves {
      display: block;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      inset: 0;
      z-index: 19;
      background: rgba(26, 23, 20, .25);
    }
  }

  .panel-hlavicka {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .7rem .9rem .5rem;
    border-bottom: 1px solid var(--linka);
  }
  .panel-nazev {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--inkoust);
    background: none;
    border: 1px solid transparent;
    border-radius: .4rem;
    padding: .3rem .4rem;
  }
  .panel-nazev:hover:not(:disabled) { border-color: var(--linka); }
  .panel-nazev:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 0; }
  .panel-nazev::placeholder { color: var(--tlum); font-weight: 400; }
  .panel-zavrit {
    appearance: none;
    border: 0;
    background: none;
    color: var(--tlum);
    font-size: 1.05rem;
    line-height: 1;
    padding: .45rem .5rem;
    cursor: pointer;
    border-radius: .4rem;
  }
  .panel-zavrit:hover { color: var(--inkoust); background: var(--vyklad-plocha); }
  .panel-kde {
    appearance: none;
    border: 0;
    background: none;
    text-align: left;
    font: inherit;
    font-size: .8rem;
    color: var(--rozhovor);
    padding: .45rem .95rem .6rem;
    cursor: pointer;
    border-bottom: 1px solid var(--linka);
  }
  .panel-kde:hover { text-decoration: underline; }
  .panel-telo {
    flex: 1;
    overflow-y: auto;
    padding: 1rem .95rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }
  .panel .psani {
    border-top: 1px solid var(--linka);
    padding: .75rem .95rem 1rem;
    background: var(--plocha);
  }

  .vlakna-mista {
    margin-top: .75rem;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .rozbal {
    appearance: none;
    border: 1px solid var(--linka);
    background: none;
    color: var(--rozhovor);
    font: inherit;
    font-size: .88rem;
    border-radius: 999px;
    padding: .4rem .9rem;
    cursor: pointer;
  }
  .rozbal:hover { border-color: var(--rozhovor); }
  /* Místo, kde už rozhovor je, to dá znát i beze slov. */
  .rozbal-plny {
    border-color: var(--rozhovor);
    background: var(--rozhovor-plocha);
    font-weight: 500;
  }
  /* Založení dalšího vlákna je nabídka, ne hlavní akce — ať nepřehluší
     rozhovory, které už na místě jsou. */
  .rozbal-novy { border-style: dashed; color: var(--tlum); }
  .rozbal-novy:hover { color: var(--rozhovor); border-color: var(--rozhovor); }
  .rozbal:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 1px; }

  .bublina { font-size: .95rem; }
  .bublina .kdo {
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--rozhovor);
    display: block;
    margin-bottom: .2rem;
  }
  .bublina p { margin: 0 0 .7rem; }
  .bublina p:last-child { margin-bottom: 0; }
  .bublina.ja { color: var(--inkoust); }
  .bublina.ja .text {
    background: var(--rozhovor-plocha);
    border-radius: .6rem;
    padding: .6rem .75rem;
    display: block;
  }

  .vlakno { display: flex; flex-direction: column; gap: .75rem; }

  .stav-ulozeni { font-size: .78rem; color: var(--tlum); }

  .psani { display: flex; flex-direction: column; gap: .5rem; }
  .dotaz {
    width: 100%;
    font: inherit;
    font-size: .95rem;
    color: var(--inkoust);
    background: var(--plocha);

  .poslat {
    appearance: none;

  }

  .drobny {
    appearance: none;

  .drobny:hover { color: var(--inkoust); }

  /* ---- přechod -------------------------------------------------------- */
  .prechod {

  .prazdno { color: var(--tlum); padding: 2rem 0; }

  /* Odstavec, na který se skočilo z citace ve hře. */
  .odstavec-cil .zneni {
    background: var(--vyklad-plocha);

  }

  /* ---- hra: jeden spis -------------------------------------------------
     Stejné plochy a písmo jako zbytek stránky. Navíc tři barvy, které nesou
     informaci: lhůta, která se blíží, lhůta, která hoří, a správná volba. */
  .hra-karta {
    border: 1px solid var(--linka);
    background: var(--plocha);
    border-radius: .75rem;
    padding: 1rem 1.1rem;
    margin-bottom: 1.25rem;

  }
  .hra-karta > .stitek { margin-bottom: .5rem; }

  .hra-den-radek { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .hra-den {
    font-family: "Source Serif 4", Georgia, serif;

    font-weight: 600;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .hra-datum { color: var(--tlum); font-size: .92rem; font-variant-numeric: tabular-nums; }

  .hra-osa {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: var(--linka);
    margin: .8rem 0 .3rem;
  }
  .hra-osa-dnes {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    border-radius: 3px;
    background: var(--pecet);
  }
  .hra-osa-znacka {
    position: absolute;
    top: -4px;
    width: 3px;
    height: 14px;
    margin-left: -1px;
    border-radius: 1px;
    background: var(--tlum);
  }
  .hra-osa-znacka.pozor { background: var(--hra-pozor); }
  .hra-osa-znacka.kriticke { background: var(--hra-kriticke); }
  .hra-osa-popis {
    display: flex;
    justify-content: space-between;
    font-size: .72rem;

  }

  .hra-posun { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .9rem; }
  .hra-posun .osa[disabled] { opacity: .4; cursor: default; }
  .hra-posun .osa-vybrana[disabled] { opacity: .4; }
  .hra-pozn { font-size: .82rem; color: var(--tlum); margin: .5rem 0 0; }

  .hra-lhuty { margin-top: 1rem; border-top: 1px solid var(--linka); }
  .hra-lhuta {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: .1rem .8rem;
    padding: .55rem 0 .55rem .7rem;
    border-bottom: 1px solid var(--linka);
    border-left: 3px solid var(--linka);
  }
  .hra-lhuta-nazev { font-size: .93rem; font-weight: 500; }
  .hra-lhuta-kdo { font-size: .78rem; color: var(--tlum); }
  .hra-lhuta-zbyva { font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .hra-lhuta-kdy { font-size: .78rem; color: var(--tlum); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hra-lhuta.moje .hra-lhuta-nazev::after {
    content: "vaše";
    margin-left: .45rem;
    font-size: .66rem;

  .hra-lhuta.pozor { border-left-color: var(--hra-pozor); }
  .hra-lhuta.pozor .hra-lhuta-zbyva { color: var(--hra-pozor); font-weight: 600; }
  .hra-lhuta.kriticke { border-left-color: var(--hra-kriticke); }
  .hra-lhuta.kriticke .hra-lhuta-zbyva { color: var(--hra-kriticke); font-weight: 600; }
  .hra-lhuta.termin { border-left-style: dotted; }

  .hra-udalost { border-color: var(--pecet); }
  .hra-udalost-nadpis {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.25;

  }
  .hra-udalost > p, .hra-text p { font-size: .96rem; margin: 0 0 .75rem; }
  .hra-podklad {
    background: var(--vyklad-plocha);
    border-radius: .6rem;
    padding: .85rem .95rem;
    margin: .3rem 0 1rem;
  }
  .hra-podklad p { font-size: .9rem; margin: 0 0 .55rem; }
  .hra-podklad p:last-child { margin-bottom: 0; }

  .hra-volby { display: flex; flex-direction: column; gap: .5rem; }
  .hra-volba {
    appearance: none;
    width: 100%;
    text-align: left;
    font: inherit;

    background: var(--papir);

  }
  .hra-volba:hover { border-color: var(--pecet); }
  .hra-volba:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }

  .hra-verdikt {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: .35rem;
  }
  .hra-verdikt.spravne { color: var(--hra-dobre); }
  .hra-verdikt.chyba { color: var(--hra-kriticke); }
  .hra-verdikt.odlozeno { color: var(--hra-pozor); }
  .hra-zvoleno { font-size: .88rem; color: var(--tlum); font-style: italic; margin: 0 0 .7rem; }

  .hra-citace { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
  .hra-cit {
    font-size: .8rem;
    color: var(--pecet);
    border: 1px solid var(--linka);
    border-radius: 999px;
    padding: .15rem .6rem;
    text-decoration: none;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  a.hra-cit:hover { border-color: var(--pecet); }
  a.hra-cit:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }
  span.hra-cit { color: var(--tlum); }

  .hra-akce { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
  .hra-akce .poslat { background: var(--pecet); }

  .hra-radek {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: .1rem .9rem;
    padding: .55rem 0;
    border-bottom: 1px solid var(--linka);

  .hra-radek:last-child { border-bottom: 0; }

  .hra-radek-stav { grid-column: 1 / -1; font-size: .78rem; color: var(--tlum); }

  .hra-denik-zaznam p { font-size: .9rem; margin: 0 0 .4rem; }
  .hra-denik-zaznam .hra-verdikt { display: inline; margin-right: .4rem; }

  .hra-skore {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .6rem;
    margin-bottom: 1.25rem;
  }
  @media (min-width: 40rem) { .hra-skore { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .hra-dlazdice {
    border: 1px solid var(--linka);
    background: var(--plocha);
    border-radius: .7rem;
    padding: .8rem .9rem;
  }
  .hra-dlazdice-cislo {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.7rem;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .hra-dlazdice-popis { font-size: .8rem; color: var(--tlum); margin-top: .2rem; }
  .hra-dlazdice.hlavni { border-color: var(--pecet); }
  .hra-dlazdice.hlavni .hra-dlazdice-cislo { color: var(--pecet); }

  .hra-zjednoduseni summary { cursor: pointer; font-size: .9rem; color: var(--tlum); }
  .hra-zjednoduseni summary:hover { color: var(--inkoust); }
  .hra-zjednoduseni ul { margin: .6rem 0 0; padding-left: 1.1rem; }
  .hra-zjednoduseni li { font-size: .88rem; margin-bottom: .4rem; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---- tisk ------------------------------------------------------------
     Na papír se nekreslí obrazovka, ale vlastní sazba: žádné plochy (jsou
     to litry inkoustu a na tiskárně stejně vypadnou), místo nich linky.
     Rozlišení patkové/bezpatkové zůstává — na papíře nese stejnou informaci
     jako na displeji, tedy kde mluví zákon a kde už někdo o zákoně. */
  .tisk { display: none; }

  @media print {
    @page { margin: 18mm 16mm 20mm; }
    html, body { background: #FFF; color: #000; }
    .obal, .panel, .panel-zaves { display: none; }
    body.s-panelem .obal { margin-right: 0; }
    .tisk { display: block; }

    .tisk {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 9.5pt;
      line-height: 1.45;
      color: #000;

    }
    .t-hlavicka { border-bottom: 1.5pt solid #000; padding-bottom: 6pt; margin-bottom: 16pt; }

    }

    .t-paragraf { break-before: page; }
    .t-paragraf:first-of-type { break-before: avoid; }
    .t-paragraf-cislo {
      font-size: 8pt;

    }
    .t-paragraf-nazev {

      font-weight: 600;
      line-height: 1.15;
      margin: 1pt 0 2pt;
      break-after: avoid;
    }
    .t-drobecky { font-size: 7.5pt; color: #555; margin-bottom: 12pt; }

    .t-odstavec { margin-bottom: 14pt; }
    .t-bod-nadpis {
      font-family: "Source Serif 4", Georgia, serif;

      font-weight: 600;

      margin: 0 0 4pt;

    }
    .t-zneni {
      font-family: "Source Serif 4", Georgia, serif;

    }
    .t-zneni-cislo { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 9pt; }

    .t-vyklad { margin: 7pt 0 0 0; padding-left: 9pt; border-left: 2pt solid #000; }
    .t-stitek {
      display: block;

    }
    .t-vyklad p { margin: 0 0 5pt; }
    .t-vyklad p:last-child { margin-bottom: 0; }
    .t-chybi { margin: 6pt 0 0; font-size: 8.5pt; color: #666; font-style: italic; }

    /* Rozhovor dostane tečkovanou linku, aby se na první pohled odlišil od
       výkladu — na papíře nemáme barvu, která to dělá na displeji. */
    .t-rozhovor { margin: 7pt 0 0 0; padding-left: 9pt; border-left: 1pt dotted #000; }
    .t-kdo {
      font-size: 7pt;

</style>

<div class="obal">
  <div class="lista">
    <button class="zpet" id="zpet" hidden>← Obsah</button>
    <span class="lista-nazev" id="lista-nazev">Insolvenční zákon</span>
    <span class="lista-stav" id="lista-stav"></span>
    <button class="tisk-tlacitko" id="rozhovory-tlacitko">Rozhovory</button>
    <button class="tisk-tlacitko" id="tisk-tlacitko">Tisk</button>
  </div>
