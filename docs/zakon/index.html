  <main id="hlavni"></main>
</div>
<div class="tisk" id="tisk" aria-hidden="true"></div>

<script src="zakon.js"></script>
<script src="vyklad.js"></script>
<script src="temata.js"></script>
<script src="pohledavky.js"></script>
<script src="hra.js"></script>
<script src="lhuty.js"></script>
<script>
(function () {
  'use strict';

  var ZAKON = window.ZAKON || [];
  var VYKLAD = window.VYKLAD || {};
  var TEMATA = window.TEMATA || [];
  var POHLEDAVKY = window.POHLEDAVKY || null;
  var HRA = window.HRA || null;
  var LHUTY = window.LHUTY || null;
  var BEZ_CISLA = '-';

  // Schopnosti dorazí až po chvíli a nemusí dorazit vůbec (jiný prohlížeč,
  // nepovolený přístup). Stránka se vykreslí bez nich a diskuze se rozsvítí,
  // až když se ozvou.
  var sample = null;

  var hlavni = document.getElementById('hlavni');
  var zpetBtn = document.getElementById('zpet');
  var listaNazev = document.getElementById('lista-nazev');
  var listaStav = document.getElementById('lista-stav');

  var podleCisla = {};
  ZAKON.forEach(function (p) { podleCisla[p.paragraf] = p; });

  /* ---- pomocné ------------------------------------------------------- */

  function bezDiakritiky(t) {
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function klicOdstavce(o) { return o.cislo || BEZ_CISLA; }

  function vykladOdstavce(p, o) {
    var k = VYKLAD[p.paragraf];
    return (k && k[klicOdstavce(o)]) || null;
  }

  function vylozeno(p) {
    return p.odstavce.filter(function (o) { return vykladOdstavce(p, o); }).length;
  }

  // Id dokumentu v úložišti. Musí projít gramatikou cest, proto podtržítko
  // místo mezery a „x" pro odstavec bez čísla.
  function klicDiskuze(p, o) {
    return p.paragraf + '-' + (o.cislo || 'x');
  }

  function el(tag, trida, text) {
    var e = document.createElement(tag);
    if (trida) e.className = trida;
    if (text != null) e.textContent = text;
    return e;
  }

  /** Text s prázdnými řádky mezi odstavci a **tučnými** úseky. */
  function vlozText(kam, text) {
    text.split('\n\n').forEach(function (odst) {
      var p = el('p');
      odst.split('**').forEach(function (usek, i) {
        if (i % 2) p.appendChild(el('strong', null, usek));
        else if (usek) p.appendChild(document.createTextNode(usek));
      });
      kam.appendChild(p);
    });
  }

  /* ---- obsah --------------------------------------------------------- */

  function hledej(dotaz) {
    var h = bezDiakritiky(dotaz).trim();
    if (!h) return null;
    var cislo = h.replace(/^§\s*/, '');
    if (/^\d+[a-z]?$/.test(cislo)) {
      return ZAKON.filter(function (p) { return p.paragraf === cislo; })
        .concat(ZAKON.filter(function (p) {
          return p.paragraf !== cislo && p.paragraf.indexOf(cislo) === 0;
        }));
    }
    var nalez = [];
    ZAKON.forEach(function (p) {
      var vNazvu = p.nazev && bezDiakritiky(p.nazev).indexOf(h) >= 0;
      var vTextu = p.odstavce.some(function (o) {
        return bezDiakritiky(o.text).indexOf(h) >= 0;
      });
      if (vNazvu || vTextu) nalez.push({ p: p, vNazvu: !!vNazvu });
    });
    nalez.sort(function (a, b) { return (b.vNazvu ? 1 : 0) - (a.vNazvu ? 1 : 0); });
    return nalez.slice(0, 60).map(function (n) { return n.p; });
  }

  function radekParagrafu(p) {
    var b = el('button', 'radek');
    b.type = 'button';
    b.appendChild(el('span', 'radek-cislo', '§ ' + p.paragraf));
    var nazev = p.nazev || p.odstavce[0].text.replace(/\s+/g, ' ').slice(0, 70) + '…';
    b.appendChild(el('span', 'radek-nazev', nazev));
    var hotovo = vylozeno(p);
    var stav = hotovo === p.odstavce.length ? 'hotovo' : hotovo ? 'castecne' : '';
    b.appendChild(el('span', 'radek-znacka ' + stav,
      hotovo === p.odstavce.length ? '●' : hotovo ? '◐' : '○'));
    b.addEventListener('click', function () { location.hash = '#p' + p.paragraf; });
    return b;
  }

  function vykresliObsah(dotaz) {
    hlavni.textContent = '';
    zpetBtn.hidden = true;
    listaNazev.textContent = 'Insolvenční zákon';

    var celkem = 0, hotovo = 0;
    ZAKON.forEach(function (p) { celkem += p.odstavce.length; hotovo += vylozeno(p); });
    listaStav.textContent = hotovo + ' / ' + celkem + ' odst.';

    hlavni.appendChild(el('h1', 'titul', 'Insolvenční zákon v praxi'));
    hlavni.appendChild(el('p', 'perex',
      'Znění zákona č. 182/2006 Sb. podle Sbírky, pod každým odstavcem výklad, ' +
      'co znamená v práci správce' +
      (sample ? ' — a možnost se k němu rovnou zeptat.' : '.')));

    var pole = el('input', 'hledani');
    pole.type = 'search';
    pole.placeholder = 'Číslo paragrafu nebo slovo';
    pole.setAttribute('aria-label', 'Hledat v zákoně');
    pole.autocomplete = 'off';
    if (dotaz) pole.value = dotaz;
    hlavni.appendChild(pole);

    var vypis = el('div');
    hlavni.appendChild(vypis);

    function radekTematu(t) {
      var b = el('button', 'radek radek-tema');
      b.type = 'button';
      b.appendChild(el('span', 'radek-nazev', t.nazev));
      b.appendChild(el('span', 'radek-pramen', t.pramen));
      b.addEventListener('click', function () { location.hash = '#t' + t.id; });
      return b;
    }

    function prekresli(text) {
      vypis.textContent = '';
      var nalez = hledej(text || '');
      if (nalez) {
        var h = bezDiakritiky(text || '').trim();
        var temata = h.length > 1 ? TEMATA.filter(function (t) {
          return bezDiakritiky(t.nazev + ' ' + t.pramen + ' ' +
            t.body.map(function (b) { return b.nadpis + ' ' + b.text; }).join(' ')
          ).indexOf(h) >= 0;
        }) : [];
        if (temata.length) {
          vypis.appendChild(el('h2', 'cast', 'Mimo insolvenční zákon'));
          temata.forEach(function (t) { vypis.appendChild(radekTematu(t)); });
          if (nalez.length) vypis.appendChild(el('h2', 'cast', 'Insolvenční zákon'));
        }
        if (!nalez.length && !temata.length) {
          vypis.appendChild(el('p', 'prazdno', 'Nic takového tu není.'));
          return;
        }
        nalez.forEach(function (p) { vypis.appendChild(radekParagrafu(p)); });
        return;
      }
      if (POHLEDAVKY || HRA || LHUTY) vypis.appendChild(el('h2', 'cast', 'Přehledy'));
      if (HRA) {
        var kartaH = el('button', 'radek radek-tema radek-prehled');
        kartaH.type = 'button';
        kartaH.appendChild(el('span', 'radek-nazev', 'Hra: Insolvenční správce — jeden spis'));
        kartaH.appendChild(el('span', 'radek-pramen', HRA.spis));
        kartaH.addEventListener('click', function () { location.hash = '#hra'; });
        vypis.appendChild(kartaH);
      }
      if (LHUTY) {
        var kartaL = el('button', 'radek radek-tema radek-prehled');
        kartaL.type = 'button';
        kartaL.appendChild(el('span', 'radek-nazev', 'Lhůty v zákoně — přehled'));
        kartaL.appendChild(el('span', 'radek-pramen', LHUTY.lhuty.length + ' lhůt'));
        kartaL.addEventListener('click', function () { location.hash = '#lhuty'; });
        vypis.appendChild(kartaL);
      }
      if (POHLEDAVKY) {
        var kartaP = el('button', 'radek radek-tema radek-prehled');
        kartaP.type = 'button';
        kartaP.appendChild(el('span', 'radek-nazev', 'Typy pohledávek — přehled'));
        kartaP.appendChild(el('span', 'radek-pramen',
          Object.keys(POHLEDAVKY.typy).length + ' typů'));
        kartaP.addEventListener('click', function () { location.hash = '#pohledavky'; });
        vypis.appendChild(kartaP);
      }

      if (TEMATA.length) {
        vypis.appendChild(el('h2', 'cast', 'Mimo insolvenční zákon'));
        var oblast = null;
        TEMATA.forEach(function (t) {
          if (t.oblast !== oblast) {
            oblast = t.oblast;
            vypis.appendChild(el('h3', 'hlava', oblast));
          }
          vypis.appendChild(radekTematu(t));
        });
      }

      var cast = null, hlava = null;
      ZAKON.forEach(function (p) {
        if (p.cast !== cast) {
          cast = p.cast;
          hlava = null;
          vypis.appendChild(el('h2', 'cast', cast));
        }
        if (p.hlava !== hlava) {
          hlava = p.hlava;
          if (hlava) vypis.appendChild(el('h3', 'hlava', hlava));
        }
        vypis.appendChild(radekParagrafu(p));
      });
    }

    var casovac;
    pole.addEventListener('input', function () {
      clearTimeout(casovac);
      casovac = setTimeout(function () { prekresli(pole.value); }, 120);
    });
    prekresli(dotaz || '');
  }

  /* ---- rozhovor pod odstavcem ---------------------------------------- */

  /* ---- ukládání rozhovorů ---------------------------------------------
     Dvě vrstvy, a to schválně. Prohlížeč drží rozhovor hned a bez ptaní,
     takže přežije obnovení stránky i tehdy, když se serverem něco je.
     Server je navíc — díky němu je rozhovor vidět i na druhém zařízení.
     Když server nejde, neschovává se to: panel to napíše. Tiché selhání
     vypadá přesně jako „nic se neukládá", a to je horší než chybová hláška. */

  var PREDPONA = 'iz-rozhovor-';

  var ulozeni = {
    db: null,
    stav: 'ceka',   // 'ceka' | 'server' | 'jen-zde'
    duvod: '',
    vlakna: {}      // klíč odstavce → {paragraf, odstavec, zpravy, zmeneno}
  };

  function zLokalniho(klic) {
    try {
      var s = localStorage.getItem(PREDPONA + klic);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  function doLokalniho(klic, zaznam) {
    try { localStorage.setItem(PREDPONA + klic, JSON.stringify(zaznam)); }
    catch (e) { /* plné nebo zakázané úložiště — snad to vezme server */ }
  }

  function vsechnoZLokalniho() {
    var mapa = {};
    try {
      for (var i = 0; i < localStorage.length; i += 1) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PREDPONA) === 0) {
          var z = zLokalniho(k.slice(PREDPONA.length));
          if (z && z.zpravy && z.zpravy.length) mapa[k.slice(PREDPONA.length)] = z;
        }
      }
    } catch (e) { /* soukromé okno, zakázané úložiště */ }
    return mapa;
  }

  function nastavStav(stav, duvod) {
    ulozeni.stav = stav;
    ulozeni.duvod = duvod || '';
    ozviSeVlaknum();
  }

  /** Uloží vlákno — nejdřív do prohlížeče, pak na server, jde-li to. */
  function ulozVlakno(klic, zpravy, nazev) {
    var puvodni = ulozeni.vlakna[klic];
    var zaznam = {
      misto: klic,
      nazev: nazev || (puvodni && puvodni.nazev) || '',
      zpravy: zpravy.slice(),
      zmeneno: Date.now()
    };
    ulozeni.vlakna[klic] = zaznam;
    doLokalniho(klic, zaznam);

    if (!ulozeni.db) return Promise.resolve();
    return ulozeni.db.doc('data/users/me/' + klic).set(zaznam).then(function () {
      if (ulozeni.stav !== 'server') nastavStav('server', '');
    }, function (e) {
      nastavStav('jen-zde', (e && e.code) || 'zápis se nepodařil');
    });
  }

  function smazVlakno(klic) {
    delete ulozeni.vlakna[klic];
    try { localStorage.removeItem(PREDPONA + klic); } catch (e) {}
    if (ulozeni.db) {
      ulozeni.db.doc('data/users/me/' + klic).delete().then(null, function () {});
    }
  }

  function popisNedostupnosti(perm) {
    if (!perm) return Promise.resolve('úložiště není k dispozici');
    return perm.state('db').then(function (stav) {
      if (stav === 'denied') return 'ukládání jsi při načtení odmítl — načti stránku znovu';
      if (stav === 'prompt') return 'ukládání zatím není povolené';
      if (stav === 'unavailable') return 'úložiště tu není k dispozici';
      return 'na server se to teď nedaří';
    }, function () { return 'úložiště není k dispozici'; });
  }

  function nastartujUlozeni() {
    // Co je v prohlížeči, je k dispozici hned — ještě než se ozve server.
    ulozeni.vlakna = vsechnoZLokalniho();
    ozviSeVlaknum();

    if (!(window.claude && window.claude.use)) {
      nastavStav('jen-zde', 'stránka běží mimo Claude');
      return;
    }

    window.claude.use('db').then(function (d) {
      if (!d) {
        return window.claude.use('permissions')
          .then(popisNedostupnosti, function () { return 'úložiště není k dispozici'; })
          .then(function (duvod) { nastavStav('jen-zde', duvod); });
      }
      ulozeni.db = d;
      // Jedno hromadné načtení místo dotazu u každého odstavce zvlášť.
      return d.collection('data/users/me').get().then(function (snap) {
        (snap.docs || []).forEach(function (doc) {
          var data = doc.data();
          if (!data || !Array.isArray(data.zpravy) || !data.zpravy.length) return;
          var mistni = ulozeni.vlakna[doc.id];
          // Novější vyhrává; bez razítka bere přednost server.
          if (!mistni || (data.zmeneno || 0) >= (mistni.zmeneno || 0)) {
            ulozeni.vlakna[doc.id] = data;
            doLokalniho(doc.id, data);
          }
        });
        nastavStav('server', '');
      });
    }).then(null, function (e) {
      nastavStav('jen-zde', (e && e.code) || 'na server se nepodařilo připojit');
    });
  }

  /* ---- rozhovor pod odstavcem ---------------------------------------- */

  function kontext(p, o, vyklad) {
    return [
      'Jsi asistent pro přípravu na obecnou zkoušku insolvenčního správce v ČR.',
      'Uživatel čte insolvenční zákon (č. 182/2006 Sb.) po odstavcích a ptá se na konkrétní místo.',
      '',
      'Odpovídej česky, stručně a prakticky — v rovině toho, co to znamená pro práci správce.',
      'Kde si nejsi jistý, řekni to. Neuváděj paragrafy, které si nepamatuješ přesně.',
      'Nepiš úvodní zdvořilosti, jdi rovnou k věci.',
      '',
      '--- MÍSTO V ZÁKONĚ ---',
      '§ ' + p.paragraf + (p.nazev ? ' — ' + p.nazev : ''),
      p.cast + (p.hlava ? ' · ' + p.hlava : '') + (p.dil ? ' · ' + p.dil : ''),
      '',
      'Znění' + (o.cislo ? ' odstavce ' + o.cislo : '') + ':',
      o.text,
      '',
      vyklad ? '--- VÝKLAD, KTERÝ UŽIVATEL PRÁVĚ ČETL ---\n' + vyklad
             : '--- K tomuto odstavci zatím žádný výklad napsaný není. ---',
      '--- KONEC KONTEXTU ---'
    ].join('\n');
  }

  /* ---- rozhovor v postranním panelu -------------------------------------
     Rozhovorů bude hodně a vmáčknuté pod odstavec se v nich nedalo vyznat.
     Vedle textu proto stojí jeden sdílený panel: na širokém displeji jako
     sloupec vedle zákona (znění zůstane vidět), na telefonu přes celou
     obrazovku. Vlákno má název — sám se navrhne z první otázky a dá se
     přepsat — a všechna se pak dají najít v přehledu.

     V místě samotném zbyde jen tlačítko, které ukazuje, jestli tam nějaký
     rozhovor je a jak se jmenuje. */

  var panel = null;   // { klic, kontext, popis, cil, ... } právě otevřené vlákno

  /** Název, který se nabídne, než si ho pojmenuje sám. */
  function odvozenyNazev(zpravy) {
    var prvni = null;
    for (var i = 0; i < zpravy.length; i += 1) {
      if (zpravy[i].role === 'user') { prvni = zpravy[i].text; break; }
    }
    if (!prvni) return '';
    var jedna = prvni.replace(/\s+/g, ' ').trim();
    return jedna.length > 48 ? jedna.slice(0, 48).replace(/\s+\S*$/, '') + '…' : jedna;
  }

  function nazevVlakna(klic) {
    var z = ulozeni.vlakna[klic];
    if (!z) return '';
    return z.nazev || odvozenyNazev(z.zpravy || []);
  }

  function pocetZprav(klic) {
    var z = ulozeni.vlakna[klic];
    return z && z.zpravy ? z.zpravy.length : 0;
  }

  /* Na jednom místě může běžet víc konverzací. První z nich má klíč místa
     samotného — díky tomu zůstávají dřívější rozhovory tam, kde byly — a
     další dostávají příponu „~2", „~3". Vlnovka proto, že se v identifikátoru
     dokumentu smí objevit a v číslech paragrafů se nevyskytuje. */

  function klicVlakna(misto, cislo) {
    return cislo <= 1 ? misto : misto + '~' + cislo;
  }

  function mistoZKlice(klic) {
    var vlnka = klic.indexOf('~');
    return vlnka < 0 ? klic : klic.slice(0, vlnka);
  }

  /** Klíče všech vláken daného místa, nejstarší první. */
  function vlaknaMista(misto) {
    return Object.keys(ulozeni.vlakna).filter(function (k) {
      // Pozor na to, že „36-1" není předponou „36-11" — proto s vlnovkou.
      if (k !== misto && k.indexOf(misto + '~') !== 0) return false;
      var z = ulozeni.vlakna[k];
      return z && z.zpravy && z.zpravy.length;
    }).sort(function (a, b) {
      return cisloVlakna(a) - cisloVlakna(b);
    });
  }

  function cisloVlakna(klic) {
    var vlnka = klic.indexOf('~');
    return vlnka < 0 ? 1 : Number(klic.slice(vlnka + 1)) || 1;
  }

  function dalsiVlakno(misto) {
    var nejvyssi = 0;
    vlaknaMista(misto).forEach(function (k) {
      nejvyssi = Math.max(nejvyssi, cisloVlakna(k));
    });
    return klicVlakna(misto, nejvyssi + 1);
  }

  /* --- tlačítko, které v místě zůstane --- */

  function rozhovorProMisto(misto, kontextText, popisMista) {
    var obal = el('div', 'vlakna-mista');

    function prekresli() {
      obal.textContent = '';
      var klice = vlaknaMista(misto);

      klice.forEach(function (k) {
        var b = el('button', 'rozbal rozbal-plny');
        b.type = 'button';
        b.textContent = nazevVlakna(k) + '  · ' + pocetZprav(k);
        b.addEventListener('click', function () {
          otevriPanel(k, kontextText, popisMista);
        });
        obal.appendChild(b);
      });

      if (sample) {
        var novy = el('button', klice.length ? 'rozbal rozbal-novy' : 'rozbal');
        novy.type = 'button';
        novy.textContent = klice.length
          ? '+ Založit novou konverzaci'
          : 'Zeptat se na tohle místo';
        novy.addEventListener('click', function () {
          otevriPanel(dalsiVlakno(misto), kontextText, popisMista);
        });
        obal.appendChild(novy);
      }

      obal.hidden = !sample && !klice.length;
    }

    obal.obnov = prekresli;
    obal.prepni = prekresli;
    obal.klicMista = misto;
    obal.otevri = function (klic) {
      otevriPanel(klic || misto, kontextText, popisMista);
    };
    prekresli();
    return obal;
  }

  /* --- samotný panel --- */

  function postavPanel() {
    if (panel) return panel;

    var korpus = el('aside', 'panel');
    korpus.setAttribute('aria-label', 'Rozhovor');
    korpus.hidden = true;

    var hlavicka = el('div', 'panel-hlavicka');
    var nadpis = el('input', 'panel-nazev');
    nadpis.setAttribute('aria-label', 'Název rozhovoru');
    nadpis.placeholder = 'Pojmenuj rozhovor';
    var zavrit = el('button', 'panel-zavrit');
    zavrit.type = 'button';
    zavrit.setAttribute('aria-label', 'Zavřít rozhovor');
    zavrit.textContent = '✕';
    hlavicka.appendChild(nadpis);
    hlavicka.appendChild(zavrit);
    korpus.appendChild(hlavicka);

    var kde = el('button', 'panel-kde');
    kde.type = 'button';
    kde.addEventListener('click', function () {
      // Z přehledu se dá panel otevřít, aniž by se stránka přepnula; tohle
      // na to místo doskočí.
      if (panel && panel.klic) {
        var m = mistoVlakna(panel.klic);
        if (m && location.hash !== m.hash) location.hash = m.hash;
      }
    });
    korpus.appendChild(kde);

    var telo = el('div', 'panel-telo');
    var vlakno = el('div', 'vlakno');
    telo.appendChild(vlakno);
    var potiz = el('div', 'potiz');
    potiz.hidden = true;
    telo.appendChild(potiz);
    var stavUlozeni = el('div', 'stav-ulozeni');
    telo.appendChild(stavUlozeni);
    korpus.appendChild(telo);

    var psani = el('div', 'psani');
    var pole = el('textarea', 'dotaz');
    pole.placeholder = 'Na co se chceš zeptat?';
    pole.setAttribute('aria-label', 'Dotaz');
    var nastroje = el('div', 'nastroje');
    var poslat = el('button', 'poslat');
    poslat.type = 'button';
    poslat.textContent = 'Zeptat se';
    var smazat = el('button', 'drobny');
    smazat.type = 'button';
    smazat.textContent = 'Smazat';
    nastroje.appendChild(poslat);
    nastroje.appendChild(smazat);
    psani.appendChild(pole);
    psani.appendChild(nastroje);
    korpus.appendChild(psani);

    var zaves = el('div', 'panel-zaves');
    zaves.hidden = true;
    zaves.addEventListener('click', zavriPanelRozhovoru);

    document.body.appendChild(zaves);
    document.body.appendChild(korpus);

    panel = {
      korpus: korpus, zaves: zaves, nadpis: nadpis, kde: kde,
      vlakno: vlakno, potiz: potiz, stav: stavUlozeni,
      pole: pole, poslat: poslat, smazat: smazat,
      klic: null, kontext: '', zpravy: [], bezi: false
    };

    zavrit.addEventListener('click', zavriPanelRozhovoru);
    poslat.addEventListener('click', odesliZPanelu);
    smazat.addEventListener('click', function () {
      if (!panel.klic) return;
      smazVlakno(panel.klic);
      panel.zpravy = [];
      zavriPanelRozhovoru();
      ozviSeVlaknum();
    });
    pole.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') odesliZPanelu();
    });
    nadpis.addEventListener('change', function () {
      if (!panel.klic || !panel.zpravy.length) return;
      ulozVlakno(panel.klic, panel.zpravy, nadpis.value.trim());
      ozviSeVlaknum();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel && !panel.korpus.hidden) zavriPanelRozhovoru();
    });

    return panel;
  }

  function otevriPanel(klic, kontextText, popisMista) {
    var p = postavPanel();
    p.klic = klic;
    p.kontext = kontextText;
    p.popis = popisMista || '';
    p.cil = location.hash;
    var z = ulozeni.vlakna[klic];
    p.zpravy = z && z.zpravy ? z.zpravy.slice() : [];
    p.nadpis.value = nazevVlakna(klic);
    p.kde.textContent = p.popis;
    p.kde.hidden = !p.popis;
    p.potiz.hidden = true;
    p.korpus.hidden = false;
    p.zaves.hidden = false;
    document.body.classList.add('s-panelem');
    vykresliPanel(null);
    p.pole.focus();
  }

  function zavriPanelRozhovoru() {
    if (!panel) return;
    panel.korpus.hidden = true;
    panel.zaves.hidden = true;
    panel.klic = null;
    document.body.classList.remove('s-panelem');
  }

  function vykresliPanel(rozepsana) {
    if (!panel) return;
    var p = panel;
    p.vlakno.textContent = '';
    p.zpravy.forEach(function (z) {
      var b = el('div', 'bublina ' + (z.role === 'user' ? 'ja' : 'claude'));
      b.appendChild(el('span', 'kdo', z.role === 'user' ? 'Já' : 'Claude'));
      if (z.role === 'user') b.appendChild(el('span', 'text', z.text));
      else vlozText(b, z.text);
      p.vlakno.appendChild(b);
    });
    if (rozepsana != null) {
      var b2 = el('div', 'bublina claude');
      b2.appendChild(el('span', 'kdo', 'Claude'));
      if (rozepsana) vlozText(b2, rozepsana);
      else b2.appendChild(el('p', null, 'Přemýšlí…'));
      p.vlakno.appendChild(b2);
    }
    p.smazat.hidden = p.zpravy.length === 0;
    p.nadpis.disabled = p.zpravy.length === 0;
    if (!p.nadpis.value) p.nadpis.value = odvozenyNazev(p.zpravy);

    if (!p.zpravy.length || ulozeni.stav === 'ceka') {
      p.stav.hidden = true;
    } else {
      p.stav.hidden = false;
      if (ulozeni.stav === 'server') {
        p.stav.className = 'stav-ulozeni';
        p.stav.textContent = 'Uloženo — uvidíš to i na jiném zařízení.';
      } else {
        p.stav.className = 'stav-ulozeni varovne';
        p.stav.textContent = 'Uloženo jen v tomhle prohlížeči: ' + ulozeni.duvod + '.';
      }
    }
    p.vlakno.parentNode.scrollTop = p.vlakno.parentNode.scrollHeight;
  }

  function odesliZPanelu() {
    var p = panel;
    if (!p || !p.klic) return;
    var text = p.pole.value.trim();
    if (!text || p.bezi || !sample) return;
    p.bezi = true;
    p.potiz.hidden = true;
    p.poslat.disabled = true;
    p.pole.value = '';
    p.zpravy.push({ role: 'user', text: text });
    vykresliPanel('');
    ulozVlakno(p.klic, p.zpravy, p.nadpis.value.trim());
    ozviSeVlaknum();

    var klicTehdy = p.klic;
    var tahy = p.zpravy.map(function (z, i) {
      return {
        role: z.role,
        content: i === 0 && z.role === 'user'
          ? p.kontext + '\n\nOtázka: ' + z.text
          : z.text
      };
    });

    sample(tahy, {
      cache: false,
      onText: function (u) { if (panel.klic === klicTehdy) vykresliPanel(u.text); }
    }).then(function (v) {
      p.zpravy.push({ role: 'assistant', text: v.text });
      if (panel.klic === klicTehdy) vykresliPanel(null);
      ulozVlakno(klicTehdy, p.zpravy, p.nadpis.value.trim());
      ozviSeVlaknum();
    }, function (e) {
      p.zpravy.pop();
      if (panel.klic === klicTehdy) vykresliPanel(null);
      ulozVlakno(klicTehdy, p.zpravy, p.nadpis.value.trim());
      ozviSeVlaknum();
      p.potiz.hidden = false;
      p.potiz.textContent =
        e && e.code === 'rate_limited' ? 'Moc dotazů za sebou. Zkus to za chvíli.'
        : e && e.code === 'not_granted' ? 'Dotazy na Claudea tady nejsou povolené.'
        : 'Nepovedlo se to odeslat. Zkus to znovu.';
    }).then(function () {
      p.bezi = false;
      p.poslat.disabled = false;
    });
  }

  /* ---- přehled rozhovorů ---------------------------------------------- */

  /** Kde vlákno patří — z klíče se dá zpětně určit místo i popis. */
  function mistoVlakna(puvodniKlic) {
    var klic = mistoZKlice(puvodniKlic);
    var poradi = cisloVlakna(puvodniKlic);
    if (klic.indexOf('t-') === 0) {
      var zbytek = klic.slice(2);
      var del = zbytek.lastIndexOf('-');
      var t = tematPodleId(zbytek.slice(0, del));
      var i = Number(zbytek.slice(del + 1));
      if (!t || !t.body[i]) return null;
      return {
        druh: 'tema',
        hash: '#t' + t.id,
        kde: t.nazev,
        bod: t.body[i].nadpis + (poradi > 1 ? ' · ' + poradi + '. konverzace' : '')
      };
    }
    var del2 = klic.lastIndexOf('-');
    var cislo = klic.slice(0, del2);
    var odst = klic.slice(del2 + 1);
    var p = podleCisla[cislo];
    if (!p) return null;
    var kdeBod = odst === 'x' ? '' : 'odstavec ' + odst;
    if (poradi > 1) kdeBod += (kdeBod ? ' · ' : '') + poradi + '. konverzace';
    return {
      druh: 'zakon',
      hash: '#p' + cislo,
      kde: '§ ' + cislo + (p.nazev ? ' — ' + p.nazev : ''),
      bod: kdeBod
    };
  }

  function vykresliRozhovory() {
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaNazev.textContent = 'Moje rozhovory';
    listaStav.textContent = '';
    zavriPanelRozhovoru();

    hlavni.appendChild(el('h1', 'titul', 'Moje rozhovory'));

    var klice = Object.keys(ulozeni.vlakna).filter(function (k) {
      var z = ulozeni.vlakna[k];
      return z && z.zpravy && z.zpravy.length;
    });

    if (!klice.length) {
      hlavni.appendChild(el('p', 'perex', sample
        ? 'Zatím žádný. Otevři si kterýkoli odstavec nebo téma a zeptej se — ' +
          'rozhovor dostane název a najdeš ho potom tady.'
        : 'Tahle verze je jen ke čtení — rozhovory s Claudem se vedou ve verzi ' +
          'na claude.ai a zůstávají tam.'));
      return;
    }

    hlavni.appendChild(el('p', 'perex',
      klice.length + (klice.length === 1 ? ' rozhovor' :
        klice.length < 5 ? ' rozhovory' : ' rozhovorů') +
      '. Nejnovější nahoře; klikni a otevře se tam, kde vznikl.'));

    var hledaci = el('input', 'hledani');
    hledaci.type = 'search';
    hledaci.placeholder = 'Hledat v mých rozhovorech';
    hledaci.setAttribute('aria-label', 'Hledat v rozhovorech');
    hledaci.autocomplete = 'off';
    hlavni.appendChild(hledaci);

    var vypis = el('div');
    hlavni.appendChild(vypis);

    function prekresli(dotaz) {
      vypis.textContent = '';
      var h = bezDiakritiky(dotaz || '').trim();
      var radky = klice.map(function (k) {
        return { klic: k, zaznam: ulozeni.vlakna[k], misto: mistoVlakna(k) };
      }).filter(function (r) {
        if (!r.misto) return false;
        if (!h) return true;
        var vse = nazevVlakna(r.klic) + ' ' + r.misto.kde + ' ' + r.misto.bod + ' ' +
          r.zaznam.zpravy.map(function (z) { return z.text; }).join(' ');
        return bezDiakritiky(vse).indexOf(h) >= 0;
      }).sort(function (a, b) {
        return (b.zaznam.zmeneno || 0) - (a.zaznam.zmeneno || 0);
      });

      if (!radky.length) {
        vypis.appendChild(el('p', 'prazdno', 'Nic takového jsi neřešil.'));
        return;
      }

      var druh = null;
      radky.forEach(function (r) {
        if (r.misto.druh !== druh && !h) {
          druh = r.misto.druh;
          vypis.appendChild(el('h2', 'cast',
            druh === 'tema' ? 'Mimo insolvenční zákon' : 'Insolvenční zákon'));
        }
        var b = el('button', 'radek radek-vlakno');
        b.type = 'button';
        var levo = el('span');
        levo.appendChild(el('span', 'vlakno-nazev', nazevVlakna(r.klic)));
        levo.appendChild(el('span', 'vlakno-kde',
          r.misto.kde + (r.misto.bod ? ' · ' + r.misto.bod : '')));
        b.appendChild(levo);
        b.appendChild(el('span', 'radek-pramen', r.zaznam.zpravy.length + ' zpráv'));
        b.addEventListener('click', function () { skocNaVlakno(r.klic, r.misto); });
        vypis.appendChild(b);
      });
    }

    var casovac;
    hledaci.addEventListener('input', function () {
      clearTimeout(casovac);
      casovac = setTimeout(function () { prekresli(hledaci.value); }, 120);
    });
    prekresli('');
  }

  /** Skočí na místo, kde vlákno vzniklo, a otevře ho. */
  function skocNaVlakno(klic, misto) {
    cekaNaOtevreni = klic;
    if (location.hash === misto.hash) smeruj();
    else location.hash = misto.hash;
  }

  var cekaNaOtevreni = null;

  /** Po vykreslení stránky otevře vlákno, na které se skočilo z přehledu. */
  function dootevri() {
    if (!cekaNaOtevreni) return;
    var hledany = cekaNaOtevreni;
    cekaNaOtevreni = null;
    var misto = mistoZKlice(hledany);
    for (var i = 0; i < zivePrepinace.length; i += 1) {
      if (zivePrepinace[i].klicMista === misto) {
        zivePrepinace[i].otevri(hledany);
        return;
      }
    }
  }
  /* ---- přehled pohledávek ------------------------------------------------
     Typy pohledávek jsou v zákoně roztroušené po desítkách paragrafů a tři
     různé osy se přes sebe překládají: pořadí uspokojení, způsob uplatnění
     a stav po přezkumu. Tahle obrazovka je dává vedle sebe a nechá mezi
     osami přepínat — proto stojí stranou zákona i témat, ať se to neplete. */

  function vykresliPohledavky() {
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaNazev.textContent = 'Pohledávky';
    listaStav.textContent = '';

    if (!POHLEDAVKY) {
      hlavni.appendChild(el('p', 'prazdno', 'Přehled pohledávek se nenačetl.'));
      return;
    }

    hlavni.appendChild(el('h1', 'titul', 'Typy pohledávek'));
    hlavni.appendChild(el('p', 'perex',
      'Tytéž pohledávky se dají třídit třemi způsoby a ty se přes sebe ' +
      'překládají. Přepni osu a podívej se na ně pokaždé jinak; klikni na ' +
      'kartu a rozbalí se podrobnosti.'));

    var prepinac = el('div', 'osy');
    var obsahOsy = el('div');
    hlavni.appendChild(prepinac);
    hlavni.appendChild(obsahOsy);

    var vybrana = POHLEDAVKY.pohledy[0].id;

    function kartaTypu(id) {
      var t = POHLEDAVKY.typy[id];
      if (!t) return el('div');
      var karta = el('div', 'typ');
      var hlava = el('button', 'typ-hlava');
      hlava.type = 'button';
      hlava.setAttribute('aria-expanded', 'false');
      var levo = el('span');
      levo.appendChild(el('span', 'typ-nazev', t.nazev));
      levo.appendChild(el('span', 'typ-zkratka', t.zkratka));
      hlava.appendChild(levo);
      hlava.appendChild(el('span', 'typ-pramen', t.pramen));
      karta.appendChild(hlava);

      var telo = el('div', 'typ-telo');
      telo.hidden = true;
      vlozText(telo, t.popis);
      var pozor = el('div', 'typ-pozor');
      pozor.appendChild(el('div', 'stitek', 'Pozor na'));
      vlozText(pozor, t.pozor);
      telo.appendChild(pozor);
      var r = rozhovorProMisto('q-' + id, kontextPohledavky(id, t), 'Pohledávky · ' + t.nazev);
      zivePrepinace.push(r);
      telo.appendChild(r);
      karta.appendChild(telo);

      hlava.addEventListener('click', function () {
        telo.hidden = !telo.hidden;
        karta.classList.toggle('typ-otevreny', !telo.hidden);
        hlava.setAttribute('aria-expanded', String(!telo.hidden));
      });
      return karta;
    }

    function prekresli() {
      prepinac.textContent = '';
      obsahOsy.textContent = '';

      POHLEDAVKY.pohledy.forEach(function (p) {
        var b = el('button', 'osa' + (p.id === vybrana ? ' osa-vybrana' : ''));
        b.type = 'button';
        b.textContent = p.nazev;
        b.addEventListener('click', function () { vybrana = p.id; prekresli(); });
        prepinac.appendChild(b);
      });

      var pohled = POHLEDAVKY.pohledy.filter(function (p) { return p.id === vybrana; })[0];
      obsahOsy.appendChild(el('p', 'osa-perex', pohled.perex));

      pohled.koleje.forEach(function (k) {
        var skupina = el('section', 'kolej');
        skupina.appendChild(el('h2', 'kolej-nazev', k.nazev));
        if (k.popis) skupina.appendChild(el('p', 'kolej-popis', k.popis));
        k.typy.forEach(function (id, i) {
          if (vybrana === 'poradi' && k.typy.length > 1) {
            skupina.appendChild(el('div', 'kolej-cislo', String(i + 1) + '.'));
          }
          skupina.appendChild(kartaTypu(id));
        });
        obsahOsy.appendChild(skupina);
      });

      obsahOsy.appendChild(cviceni());
    }

    function cviceni() {
      var obal = el('section', 'cviceni');
      obal.appendChild(el('h2', 'kolej-nazev', 'Zařaď pohledávku'));
      obal.appendChild(el('p', 'kolej-popis',
        'Deset situací z praxe. Rozmysli si odpověď a pak ji odkryj.'));
      POHLEDAVKY.cviceni.forEach(function (c) {
        var polozka = el('div', 'uloha');
        polozka.appendChild(el('p', 'uloha-zadani', c.zadani));
        var odkryt = el('button', 'rozbal');
        odkryt.type = 'button';
        odkryt.textContent = 'Odkrýt odpověď';
        var reseni = el('div', 'uloha-reseni');
        reseni.hidden = true;
        var t = POHLEDAVKY.typy[c.odpoved];
        reseni.appendChild(el('div', 'uloha-typ', t ? t.nazev : c.odpoved));
        vlozText(reseni, c.vysvetleni);
        odkryt.addEventListener('click', function () {
          reseni.hidden = false;
          odkryt.hidden = true;
        });
        polozka.appendChild(odkryt);
        polozka.appendChild(reseni);
        obal.appendChild(polozka);
      });
      return obal;
    }

    prekresli();
    window.scrollTo(0, 0);
    dootevri();
  }

  function kontextPohledavky(id, t) {
    return [
      'Jsi asistent pro přípravu na obecnou zkoušku insolvenčního správce v ČR.',
      'Uživatel si prochází přehled typů pohledávek podle insolvenčního zákona',
      '(č. 182/2006 Sb.) a ptá se na jeden z nich.',
      '',
      'Odpovídej česky, stručně a prakticky — co to znamená pro práci správce.',
      'Kde si nejsi jistý, řekni to. Neuváděj paragrafy, které si nepamatuješ přesně.',
      'Nepiš úvodní zdvořilosti, jdi rovnou k věci.',
      '',
      '--- TYP POHLEDÁVKY ---',
      t.nazev + '  (' + t.pramen + ')',
      t.zkratka,
      '',
      t.popis,
      '',
      '--- NA CO SI DÁT POZOR ---',
      t.pozor,
      '--- KONEC KONTEXTU ---'
    ].join('\n');
  }

  /* ---- přehled lhůt ------------------------------------------------------
     Lhůty jsou roztroušené po celém zákoně a § 83 je dělá nemilosrdnými —
     prominout se nedají. Tenhle přehled je proto řadí podle toho, co se
     stane, když uplynou, a nechá je filtrovat podle toho, koho se týkají. */

  function vykresliLhuty() {
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaNazev.textContent = 'Lhůty';
    listaStav.textContent = '';

    if (!LHUTY) {
      hlavni.appendChild(el('p', 'prazdno', 'Přehled lhůt se nenačetl.'));
      return;
    }

    hlavni.appendChild(el('h1', 'titul', 'Lhůty v insolvenčním zákoně'));

    var uvod = el('div', 'vyklad');
    uvod.appendChild(el('div', 'stitek', LHUTY.uvod.nadpis));
    vlozText(uvod, LHUTY.uvod.text);
    var legenda = el('div', 'legenda');
    Object.keys(LHUTY.nasledky).forEach(function (k) {
      var r = el('div', 'legenda-radek');
      r.appendChild(el('span', 'znacka-nasledku n-' + k, ''));
      var t = el('span');
      t.appendChild(el('strong', null, LHUTY.nasledky[k].nazev + ' — '));
      t.appendChild(document.createTextNode(LHUTY.nasledky[k].popis));
      r.appendChild(t);
      legenda.appendChild(r);
    });
    uvod.appendChild(legenda);
    hlavni.appendChild(uvod);

    var filtrKdo = 'vse';
    var dotaz = '';

    var ovladani = el('div', 'osy');
    hlavni.appendChild(ovladani);
    var pole = el('input', 'hledani');
    pole.type = 'search';
    pole.placeholder = 'Hledat ve lhůtách — třeba „přihláš“ nebo „§ 239“';
    pole.setAttribute('aria-label', 'Hledat ve lhůtách');
    pole.autocomplete = 'off';
    hlavni.appendChild(pole);
    var vypis = el('div');
    hlavni.appendChild(vypis);

    function sedi(l) {
      if (filtrKdo !== 'vse' && l.kdo.indexOf(filtrKdo) < 0) return false;
      if (!dotaz) return true;
      var vse = l.delka + ' ' + l.co + ' ' + l.pramen + ' ' + l.odkdy + ' ' +
        l.faze + ' ' + (l.pozn || '');
      return bezDiakritiky(vse).indexOf(dotaz) >= 0;
    }

    function prekresli() {
      ovladani.textContent = '';
      var volby = [['vse', 'Všechny']].concat(
        Object.keys(LHUTY.kdo).map(function (k) { return [k, LHUTY.kdo[k]]; }));
      volby.forEach(function (dv) {
        var b = el('button', 'osa' + (dv[0] === filtrKdo ? ' osa-vybrana' : ''));
        b.type = 'button';
        var kolik = LHUTY.lhuty.filter(function (l) {
          return dv[0] === 'vse' || l.kdo.indexOf(dv[0]) >= 0;
        }).length;
        b.textContent = dv[1] + ' (' + kolik + ')';
        b.addEventListener('click', function () { filtrKdo = dv[0]; prekresli(); });
        ovladani.appendChild(b);
      });

      vypis.textContent = '';
      var nalezeno = 0;
      LHUTY.faze.forEach(function (f) {
        var vFazi = LHUTY.lhuty.filter(function (l) { return l.faze === f && sedi(l); });
        if (!vFazi.length) return;
        nalezeno += vFazi.length;
        vypis.appendChild(el('h2', 'cast', f));
        vFazi.forEach(function (l) { vypis.appendChild(radekLhuty(l)); });
      });
      if (!nalezeno) {
        vypis.appendChild(el('p', 'prazdno', 'Žádná lhůta tomu neodpovídá.'));
      }
    }

    function radekLhuty(l) {
      var karta = el('div', 'lhuta n-' + l.nasledek);
      var hlava = el('div', 'lhuta-hlava');
      hlava.appendChild(el('span', 'lhuta-delka', l.delka));
      var stred = el('span', 'lhuta-stred');
      stred.appendChild(el('span', 'lhuta-co', l.co));
      stred.appendChild(el('span', 'lhuta-odkdy', l.odkdy));
      hlava.appendChild(stred);
      hlava.appendChild(el('span', 'typ-pramen', l.pramen));
      karta.appendChild(hlava);

      var paticka = el('div', 'lhuta-paticka');
      paticka.appendChild(el('span', 'nasledek-stitek n-' + l.nasledek,
        LHUTY.nasledky[l.nasledek].nazev));
      l.kdo.forEach(function (k) {
        paticka.appendChild(el('span', 'kdo-stitek', LHUTY.kdo[k]));
      });
      karta.appendChild(paticka);

      if (l.pozn) {
        var pozn = el('div', 'lhuta-pozn');
        vlozText(pozn, l.pozn);
        karta.appendChild(pozn);
      }
      return karta;
    }

    var casovac;
    pole.addEventListener('input', function () {
      clearTimeout(casovac);
      casovac = setTimeout(function () {
        dotaz = bezDiakritiky(pole.value).trim();
        prekresli();
      }, 120);
    });

    prekresli();
    window.scrollTo(0, 0);
  }

  /* ---- témata mimo insolvenční zákon ------------------------------------
     Zkouška se neptá jen na insolvenční zákon. Tahle část drží témata ze
     zákona o obchodních korporacích a z občanského zákoníku, která do
     insolvenční praxe zasahují nejvíc — psaná stejně jako výklad, tedy přes
     to, co s nimi správce dělá, a vždy s ověřeným paragrafem. */

  function tematPodleId(id) {
    for (var i = 0; i < TEMATA.length; i += 1) if (TEMATA[i].id === id) return TEMATA[i];
    return null;
  }

  function kontextTematu(t, bod) {
    return [
      'Jsi asistent pro přípravu na obecnou zkoušku insolvenčního správce v ČR.',
      'Uživatel čte výklad k tématu, které leží mimo insolvenční zákon, ale do',
      'insolvenční praxe zasahuje. Ptá se na konkrétní bod toho výkladu.',
      '',
      'Odpovídej česky, stručně a prakticky — v rovině toho, co to znamená pro',
      'práci insolvenčního správce. Kde si nejsi jistý, řekni to.',
      'Neuváděj paragrafy, které si nepamatuješ přesně.',
      'Nepiš úvodní zdvořilosti, jdi rovnou k věci.',
      '',
      '--- TÉMA ---',
      t.oblast + ' — ' + t.nazev,
      'Prameny: ' + t.pramen,
      '',
      '--- BOD, KTERÝ UŽIVATEL PRÁVĚ ČETL ---',
      bod.nadpis,
      bod.text,
      '--- KONEC KONTEXTU ---'
    ].join('\n');
  }

  function vykresliTema(id) {
    var t = tematPodleId(id);
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaStav.textContent = '';

    if (!t) {
      listaNazev.textContent = 'Téma není';
      hlavni.appendChild(el('p', 'prazdno', 'Takové téma tu není.'));
      return;
    }

    listaNazev.textContent = t.nazev;
    hlavni.appendChild(el('div', 'p-cislo', t.oblast));
    hlavni.appendChild(el('h1', 'p-nazev', t.nazev));
    hlavni.appendChild(el('p', 'drobecky', t.pramen));

    t.body.forEach(function (bod, i) {
      var blok = el('section', 'odstavec');
      blok.appendChild(el('h2', 'bod-nadpis', bod.nadpis));
      var karta = el('div', 'vyklad');
      vlozText(karta, bod.text);
      blok.appendChild(karta);
      var r = rozhovorProMisto(
        't-' + t.id + '-' + i,
        kontextTematu(t, bod),
        t.nazev + ' · ' + bod.nadpis
      );
      zivePrepinace.push(r);
      blok.appendChild(r);
      hlavni.appendChild(blok);
    });

    var i2 = TEMATA.indexOf(t);
    var prechod = el('div', 'prechod');
    var dozadu = el('button');
    dozadu.type = 'button';
    if (i2 > 0) {
      dozadu.textContent = '← ' + TEMATA[i2 - 1].nazev;
      dozadu.addEventListener('click', function () { location.hash = '#t' + TEMATA[i2 - 1].id; });
    } else {
      dozadu.style.visibility = 'hidden';
      dozadu.textContent = '—';
    }
    prechod.appendChild(dozadu);
    if (i2 < TEMATA.length - 1) {
      var dopredu = el('button');
      dopredu.type = 'button';
      dopredu.textContent = TEMATA[i2 + 1].nazev + ' →';
      dopredu.addEventListener('click', function () { location.hash = '#t' + TEMATA[i2 + 1].id; });
      prechod.appendChild(dopredu);
    }
    hlavni.appendChild(prechod);
    window.scrollTo(0, 0);
    dootevri();
  }

  /* ---- paragraf ------------------------------------------------------- */

  var zivePrepinace = [];

  /** Dá vědět rozhovorům na obrazovce, že se uložená data nebo stav změnily. */
  function ozviSeVlaknum() {
    zivePrepinace.forEach(function (r) { r.obnov(); });
  }

  function vykresliParagraf(cislo, odstavec) {
    var p = podleCisla[cislo];
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaStav.textContent = '';

    if (!p) {
      listaNazev.textContent = 'Paragraf není';
      hlavni.appendChild(el('p', 'prazdno', 'Takový paragraf v zákoně není.'));
      return;
    }

    listaNazev.textContent = '§ ' + p.paragraf;

    if (p.nazev) {
      hlavni.appendChild(el('div', 'p-cislo', '§ ' + p.paragraf));
      hlavni.appendChild(el('h1', 'p-nazev', p.nazev));
    } else {
      hlavni.appendChild(el('h1', 'p-nazev', '§ ' + p.paragraf));
    }
    hlavni.appendChild(el('p', 'drobecky',
      [p.cast, p.hlava, p.dil, p.oddil].filter(Boolean).join(' · ')));

    p.odstavce.forEach(function (o) {
      var blok = el('section', 'odstavec');
      blok.setAttribute('data-odst', o.cislo || 'x');

      var zneni = el('p', 'zneni');
      if (o.cislo) zneni.appendChild(el('span', 'zneni-cislo', '(' + o.cislo + ') '));
      zneni.appendChild(document.createTextNode(o.text));
      blok.appendChild(zneni);

      var v = vykladOdstavce(p, o);
      if (v) {
        var karta = el('div', 'vyklad');
        karta.appendChild(el('div', 'stitek', 'V praxi'));
        vlozText(karta, v);
        blok.appendChild(karta);
      } else {
        blok.appendChild(el('p', 'chybi', 'Výklad k tomuhle odstavci ještě nemám.'));
      }

      var r = rozhovorProMisto(
        klicDiskuze(p, o),
        kontext(p, o, v),
        '§ ' + p.paragraf + (o.cislo ? ' odst. ' + o.cislo : '') +
          (p.nazev ? ' — ' + p.nazev : '')
      );
      zivePrepinace.push(r);
      blok.appendChild(r);

      hlavni.appendChild(blok);
    });

    var i = ZAKON.indexOf(p);
    var prechod = el('div', 'prechod');
    var dozadu = el('button');
    dozadu.type = 'button';
    if (i > 0) {
      dozadu.textContent = '← § ' + ZAKON[i - 1].paragraf;
      dozadu.addEventListener('click', function () {
        location.hash = '#p' + ZAKON[i - 1].paragraf;
      });
    } else {
      dozadu.style.visibility = 'hidden';
      dozadu.textContent = '—';
    }
    prechod.appendChild(dozadu);
    if (i < ZAKON.length - 1) {
      var dopredu = el('button');
      dopredu.type = 'button';
      dopredu.textContent = '§ ' + ZAKON[i + 1].paragraf + ' →';
      dopredu.addEventListener('click', function () {
        location.hash = '#p' + ZAKON[i + 1].paragraf;
      });
      prechod.appendChild(dopredu);
    }
    hlavni.appendChild(prechod);
    window.scrollTo(0, 0);
    var cil = odstavec && hlavni.querySelector('[data-odst="' + odstavec + '"]');
    if (cil) {
      cil.classList.add('odstavec-cil');
      cil.scrollIntoView({ block: 'start' });
      window.scrollBy(0, -70);   // pod lepkavou lištu
    }
    dootevri();
  }

  /* ---- tisk ------------------------------------------------------------
     Na papír se nevykresluje obrazovka, ale vlastní dokument — jinak by se
     tisklo i to, co je sbalené, a chybělo by to, co je uložené jinde než
     v právě otevřeném paragrafu. Rozhovory se proto před tiskem dotáhnou
     z úložiště pro všechny paragrafy, které se mají tisknout. */

  var tiskMisto = document.getElementById('tisk-misto');
  var tiskCil = document.getElementById('tisk');
  var tiskBtn = document.getElementById('tisk-tlacitko');
  var tiskPanel = null;

  function maVyklad(p) { return vylozeno(p) > 0; }

  /** Všechny uložené rozhovory, jako {"36-5": [zprávy]}. */
  function vsechnyRozhovory() {
    var mapa = {};
    Object.keys(ulozeni.vlakna).forEach(function (k) {
      var z = ulozeni.vlakna[k];
      if (z && z.zpravy && z.zpravy.length) mapa[k] = z;
    });
    return mapa;
  }

  function maNejakyRozhovor() { return Object.keys(vsechnyRozhovory()).length > 0; }

  function tiskniParagraf(p, rozhovory, sRozhovory) {
    var sekce = el('section', 't-paragraf');
    sekce.appendChild(el('div', 't-paragraf-cislo', '§ ' + p.paragraf));
    if (p.nazev) sekce.appendChild(el('h2', 't-paragraf-nazev', p.nazev));
    sekce.appendChild(el('div', 't-drobecky',
      [p.cast, p.hlava, p.dil, p.oddil].filter(Boolean).join(' · ')));

    p.odstavce.forEach(function (o) {
      var blok = el('div', 't-odstavec');

      var zneni = el('p', 't-zneni');
      if (o.cislo) zneni.appendChild(el('span', 't-zneni-cislo', '(' + o.cislo + ') '));
      zneni.appendChild(document.createTextNode(o.text));
      blok.appendChild(zneni);

      var v = vykladOdstavce(p, o);
      if (v) {
        var karta = el('div', 't-vyklad');
        karta.appendChild(el('span', 't-stitek', 'V praxi'));
        vlozText(karta, v);
        blok.appendChild(karta);
      }

      if (sRozhovory) {
        vlaknaMista(klicDiskuze(p, o)).forEach(function (k) {
          blok.appendChild(tiskniVlakno(rozhovory[k]));
        });
      }

      sekce.appendChild(blok);
    });
    return sekce;
  }

  /** Jedno vlákno na papír, i s názvem, který mu Richard dal. */
  function tiskniVlakno(vl) {
    var vlakno = el('div', 't-rozhovor');
    vlakno.appendChild(el('span', 't-stitek',
      'Můj rozhovor: ' + (vl.nazev || odvozenyNazev(vl.zpravy))));
    vl.zpravy.forEach(function (z) {
      var b = el('div', 't-bublina ' + (z.role === 'user' ? 'ja' : 'claude'));
      b.appendChild(el('div', 't-kdo', z.role === 'user' ? 'Já' : 'Claude'));
      vlozText(b, z.text);
      vlakno.appendChild(b);
    });
    return vlakno;
  }

  function tiskniTema(t, rozhovory, sRozhovory) {
    var sekce = el('section', 't-paragraf');
    sekce.appendChild(el('div', 't-paragraf-cislo', t.oblast));
    sekce.appendChild(el('h2', 't-paragraf-nazev', t.nazev));
    sekce.appendChild(el('div', 't-drobecky', t.pramen));

    t.body.forEach(function (bod, i) {
      var blok = el('div', 't-odstavec');
      blok.appendChild(el('h3', 't-bod-nadpis', bod.nadpis));
      var karta = el('div', 't-vyklad');
      vlozText(karta, bod.text);
      blok.appendChild(karta);

      if (sRozhovory) {
        vlaknaMista('t-' + t.id + '-' + i).forEach(function (k) {
          blok.appendChild(tiskniVlakno(rozhovory[k]));
        });
      }
      sekce.appendChild(blok);
    });
    return sekce;
  }

  function vytiskni(paragrafy, sRozhovory, popisRozsahu, temata) {
    var rozhovory = vsechnyRozhovory();
    return Promise.resolve().then(function () {
      tiskCil.textContent = '';

      var hlavicka = el('header', 't-hlavicka');
      hlavicka.appendChild(el('div', 't-nadpis', 'Insolvenční zákon v praxi'));
      hlavicka.appendChild(el('div', 't-podnadpis',
        'Zákon č. 182/2006 Sb., znění podle Sbírky · ' + popisRozsahu +
        ' · vytištěno ' + new Date().toLocaleDateString('cs-CZ')));
      tiskCil.appendChild(hlavicka);

      (temata || []).forEach(function (t) {
        tiskCil.appendChild(tiskniTema(t, rozhovory, sRozhovory));
      });
      paragrafy.forEach(function (p) {
        tiskCil.appendChild(tiskniParagraf(p, rozhovory, sRozhovory));
      });

      tiskCil.appendChild(el('div', 't-patka',
        'Výklad je neoficiální a slouží k přípravě na zkoušku insolvenčního ' +
        'správce; závazné je jen znění předpisu.'));

      // Prohlížeč musí stihnout dokument složit, než otevře náhled.
      return new Promise(function (hotovo) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.print();
            hotovo();
          });
        });
      });
    });
  }

  function zavriPanel() {
    if (tiskPanel) { tiskPanel.remove(); tiskPanel = null; }
  }

  function otevriTiskPanel() {
    if (tiskPanel) { zavriPanel(); return; }

    var h = location.hash.replace(/^#/, '');
    var otevreny = h.indexOf('p') === 0 ? podleCisla[h.slice(1).split('-')[0]] : null;
    var sVykladem = ZAKON.filter(maVyklad);
    var odstavcuSVykladem = 0;
    sVykladem.forEach(function (p) { odstavcuSVykladem += p.odstavce.length; });

    tiskPanel = el('div', 'tisk-panel');
    tiskPanel.appendChild(el('div', 'stitek', 'Co vytisknout'));

    var volby = [];
    function pridejVolbu(hodnota, popis, kolik, vychozi) {
      var l = el('label', 'tisk-volba');
      var r = document.createElement('input');
      r.type = 'radio';
      r.name = 'tisk-rozsah';
      r.value = hodnota;
      r.checked = !!vychozi;
      l.appendChild(r);
      var t = el('span');
      t.appendChild(document.createTextNode(popis + ' '));
      t.appendChild(el('span', 'kolik', kolik));
      l.appendChild(t);
      tiskPanel.appendChild(l);
      volby.push(r);
    }

    if (otevreny) {
      pridejVolbu('tento', 'Tento paragraf',
        '§ ' + otevreny.paragraf + ' · ' + otevreny.odstavce.length + ' odst.', true);
    }
    pridejVolbu('vyklad', 'Vše, k čemu je výklad',
      sVykladem.length + ' paragrafů · ' + odstavcuSVykladem + ' odst.', !otevreny);
    pridejVolbu('vse', 'Celý zákon',
      ZAKON.length + ' paragrafů · dlouhé', false);
    if (TEMATA.length) {
      var boduCelkem = 0;
      TEMATA.forEach(function (t) { boduCelkem += t.body.length; });
      pridejVolbu('temata', 'Mimo insolvenční zákon',
        TEMATA.length + ' témat · ' + boduCelkem + ' bodů', false);
    }

    var lb = el('label', 'tisk-volba');
    var zaskrt = document.createElement('input');
    zaskrt.type = 'checkbox';
    var jsouRozhovory = maNejakyRozhovor();
    zaskrt.checked = jsouRozhovory;
    zaskrt.disabled = !jsouRozhovory;
    lb.appendChild(zaskrt);
    lb.appendChild(el('span', null, jsouRozhovory
      ? 'Včetně mých rozhovorů s Claudem'
      : 'Zatím nemáš u žádného odstavce rozhovor'));
    tiskPanel.appendChild(lb);

    var akce = el('div', 'tisk-akce');
    var ok = el('button', 'poslat');
    ok.type = 'button';
    ok.textContent = 'Vytisknout';
    var zrus = el('button', 'drobny');
    zrus.type = 'button';
    zrus.textContent = 'Zavřít';
    akce.appendChild(ok);
    akce.appendChild(zrus);
    tiskPanel.appendChild(akce);

    ok.addEventListener('click', function () {
      var rozsah = 'vyklad';
      volby.forEach(function (r) { if (r.checked) rozsah = r.value; });
      var sada, popis, temata = null;
      if (rozsah === 'temata') {
        sada = [];
        temata = TEMATA;
        popis = 'mimo insolvenční zákon';
      } else if (rozsah === 'tento' && otevreny) {
        sada = [otevreny];
        popis = '§ ' + otevreny.paragraf;
      } else if (rozsah === 'vse') {
        sada = ZAKON;
        popis = 'celý zákon';
      } else {
        sada = sVykladem;
        popis = 'paragrafy s výkladem';
      }
      ok.disabled = true;
      ok.textContent = 'Připravuju…';
      vytiskni(sada, zaskrt.checked, popis, temata).then(function () {
        ok.disabled = false;
        ok.textContent = 'Vytisknout';
        zavriPanel();
      });
    });
    zrus.addEventListener('click', zavriPanel);

    tiskMisto.appendChild(tiskPanel);
  }

  tiskBtn.addEventListener('click', otevriTiskPanel);
  document.getElementById('rozhovory-tlacitko').addEventListener('click', function () {
    location.hash = '#rozhovory';
  });

  /* ---- hra: jeden spis -------------------------------------------------
     Minihra nad spisem Truhlárny Bureš. Scénář je celý v hra.json: události,
     volby, lhůty a co která volba způsobí. Tady je jen stroj, který posouvá
     čas, hlídá lhůty a na konci spočítá rozvrh. Peníze se počítají až na
     konci z toho, co ve spisu zbylo — tak, jak by je počítal správce.

     Postup se drží v localStorage, ale jen jako pohodlí: když úložiště nejde,
     hra běží dál v paměti a skončí s obnovením stránky. */

  var HRA_KLIC = 'iz-hra-bures';
  var hraStav = null;
  var hraScroll = null;

  function kc(n) {
    return Math.round(n).toLocaleString('cs-CZ') + ' Kč';
  }

  function hraDatum(den) {
    var z = HRA.zacatek.split('-');
    return new Date(Number(z[0]), Number(z[1]) - 1, Number(z[2]) + den);
  }

  var DNY_TYDNE = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];

  function fmtDatum(den, sDnem) {
    var d = hraDatum(den);
    return (sDnem ? DNY_TYDNE[d.getDay()] + ' ' : '') +
      d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
  }

  function denZData(d) {
    var z = hraDatum(0);
    return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) -
      Date.UTC(z.getFullYear(), z.getMonth(), z.getDate())) / 864e5);
  }

  /** Konec lhůty podle § 57 o. s. ř.: den vzniku se nepočítá, měsíce a roky
      končí dnem se stejným číslem, a není-li ho, posledním dnem měsíce. */
  function konecLhuty(spec, dnes) {
    var od = spec.od != null ? spec.od : dnes;
    if (spec.dny) return od + spec.dny;
    if (spec.mesice || spec.roky) {
      var d = hraDatum(od);
      var m = (spec.mesice || 0) + 12 * (spec.roky || 0);
      var cil = new Date(d.getFullYear(), d.getMonth() + m, 1);
      var posledni = new Date(cil.getFullYear(), cil.getMonth() + 1, 0).getDate();
      cil.setDate(Math.min(d.getDate(), posledni));
      return denZData(cil);
    }
    return od;
  }

  function slij(cil, zdroj) {
    Object.keys(zdroj).forEach(function (k) { cil[k] = zdroj[k]; });
  }

  function udalostHry(id) {
    for (var i = 0; i < HRA.udalosti.length; i += 1) {
      if (HRA.udalosti[i].id === id) return HRA.udalosti[i];
    }
    return null;
  }

  function veritelHry(id) {
    for (var i = 0; i < HRA.veritele.length; i += 1) {
      if (HRA.veritele[i].id === id) return HRA.veritele[i];
    }
    return null;
  }

  /* --- stav a jeho ukládání --- */

  function novyStavHry() {
    var s = {
      verze: HRA.verze, den: 0, konec: false,
      hotovo: {}, odlozene: [], otevrena: null, vysledek: null,
      flags: {}, pricti: {}, lhuty: [], planovane: [], denik: [],
      pocty: { zmeskane: 0, prohrane: 0, vyhrane: 0, chyby: 0 },
      majetek: {}, veritele: {}
    };
    HRA.majetek.forEach(function (m) {
      s.majetek[m.id] = { stav: m.stav, hodnota: m.hodnota, skryty: !!m.skryty, vytezek: 0 };
    });
    HRA.veritele.forEach(function (v) {
      s.veritele[v.id] = {
        stav: v.stav, skryty: !!v.skryty,
        zjisteno: v.zjisteno != null ? v.zjisteno : v.castka
      };
    });
    HRA.milniky.forEach(function (m) { s.planovane.push(JSON.parse(JSON.stringify(m))); });
    provedEfekty(s, HRA.na_zacatku);
    s.denik.push({
      den: 0, hodnoceni: 'info', text: HRA.uvod,
      citace: [{ par: '97', odst: '1' }, { par: '89', odst: '1' }]
    });
    return s;
  }

  function nactiHru() {
    try {
      var t = localStorage.getItem(HRA_KLIC);
      var s = t ? JSON.parse(t) : null;
      if (s && s.verze === HRA.verze) return s;
    } catch (e) { /* soukromé okno, zakázané úložiště */ }
    return null;
  }

  function ulozHru() {
    try { localStorage.setItem(HRA_KLIC, JSON.stringify(hraStav)); }
    catch (e) { /* nevadí — hra běží v paměti */ }
  }

  function smazHru() {
    try { localStorage.removeItem(HRA_KLIC); } catch (e) {}
  }

  /* --- stroj --- */

  function provedEfekty(s, ef) {
    if (!ef) return;
    if (ef.nastav) slij(s.flags, ef.nastav);
    if (ef.pocty) Object.keys(ef.pocty).forEach(function (k) {
      s.pocty[k] = (s.pocty[k] || 0) + ef.pocty[k];
    });
    if (ef.pricti) Object.keys(ef.pricti).forEach(function (k) {
      s.pricti[k] = (s.pricti[k] || 0) + ef.pricti[k];
    });
    // Majetek, na který hra sáhne, se tím objeví v soupisu.
    if (ef.majetek) Object.keys(ef.majetek).forEach(function (id) {
      s.majetek[id].skryty = false;
      slij(s.majetek[id], ef.majetek[id]);
    });
    if (ef.veritel) Object.keys(ef.veritel).forEach(function (id) {
      slij(s.veritele[id], ef.veritel[id]);
    });
    (ef.lhuta || []).forEach(function (spec) {
      s.lhuty = s.lhuty.filter(function (l) { return l.id !== spec.id; });
      s.lhuty.push({
        id: spec.id,
        od: spec.od != null ? spec.od : s.den,
        konec: konecLhuty(spec, s.den),
        stav: 'bezi'
      });
    });
    (ef.splnit || []).forEach(function (id) {
      s.lhuty.forEach(function (l) { if (l.id === id && l.stav === 'bezi') l.stav = 'splnena'; });
    });
    (ef.pozdeji || []).forEach(function (p) {
      var kopie = JSON.parse(JSON.stringify(p));
      kopie.den = p.den != null ? p.den : s.den + p.za;
      // Soud ani věřitelé o víkendu nejednají — výsledek přijde v pondělí.
      while (hraDatum(kopie.den).getDay() % 6 === 0) kopie.den += 1;
      s.planovane.push(kopie);
    });
  }

  function splnujePodminku(s, u) {
    if (!u.podminka) return true;
    return Object.keys(u.podminka).every(function (k) { return s.flags[k] === u.podminka[k]; });
  }

  function cekaNaRozhodnuti(s, u) {
    return !(u.id in s.hotovo) && s.odlozene.indexOf(u.id) < 0 && splnujePodminku(s, u);
  }

  function aktivniUdalost(s) {
    if (s.otevrena) return udalostHry(s.otevrena);
    var nalez = null;
    HRA.udalosti.forEach(function (u) {
      if (u.den <= s.den && cekaNaRozhodnuti(s, u) && (!nalez || u.den < nalez.den)) nalez = u;
    });
    return nalez;
  }

  function dalsiZastaveni(s) {
    var cil = HRA.konec.den;
    HRA.udalosti.forEach(function (u) {
      if (u.den > s.den && cekaNaRozhodnuti(s, u)) cil = Math.min(cil, u.den);
    });
    return cil;
  }

  function zapisDoDeniku(s, z) {
    s.denik.push({
      den: s.den, nadpis: z.nadpis || '', volba: z.volba || '',
      text: z.text, citace: z.citace || [], hodnoceni: z.hodnoceni || 'info'
    });
  }

  /** Co se stane, když den skončí: doběhnou lhůty a naplánované události. */
  function zpracujDen(s) {
    s.planovane.sort(function (a, b) { return a.den - b.den; });
    var dnes = s.planovane.filter(function (p) { return p.den <= s.den; });
    s.planovane = s.planovane.filter(function (p) { return p.den > s.den; });
    dnes.forEach(function (p) {
      zapisDoDeniku(s, p);
      provedEfekty(s, p.efekty);
    });

    s.lhuty.forEach(function (l) {
      if (l.stav !== 'bezi' || l.konec >= s.den) return;
      var def = HRA.lhuty[l.id];
      if (def.termin) { l.stav = 'probehl'; return; }
      l.stav = 'uplynula';
      var pk = def.pri_konci;
      if (def.udalost) {
        // Vlastní lhůta správce: propadne jen to, co pořád leží odložené.
        if (s.odlozene.indexOf(def.udalost) < 0) return;
        l.stav = 'zmeskana';
        s.odlozene = s.odlozene.filter(function (id) { return id !== def.udalost; });
        s.hotovo[def.udalost] = -1;
      }
      if (pk) {
        zapisDoDeniku(s, { text: pk.text, citace: pk.citace, hodnoceni: pk.hodnoceni });
        provedEfekty(s, pk.efekty);
      }
    });
  }

  function posunCas(s, cil) {
    cil = Math.min(cil, HRA.konec.den);
    s.vysledek = null;
    while (s.den < cil) {
      s.den += 1;
      zpracujDen(s);
      if (aktivniUdalost(s)) break;
    }
    if (s.den >= HRA.konec.den && !aktivniUdalost(s)) {
      // Spory, které by doběhly až po konečné zprávě, hra uzavře teď.
      s.planovane.sort(function (a, b) { return a.den - b.den; });
      s.planovane.forEach(function (p) {
        zapisDoDeniku(s, p);
        provedEfekty(s, p.efekty);
      });
      s.planovane = [];
      s.konec = true;
    }
  }

  function zvolHru(s, u, i) {
    var v = u.volby[i];
    provedEfekty(s, u.efekty);
    provedEfekty(s, v.efekty);
    if (v.odlozit) {
      if (s.odlozene.indexOf(u.id) < 0) s.odlozene.push(u.id);
    } else {
      s.hotovo[u.id] = i;
      s.odlozene = s.odlozene.filter(function (id) { return id !== u.id; });
      // Rozhodnuto — vlastní lhůta k téhle věci už nehoří, ať dopadlo jakkoli.
      s.lhuty.forEach(function (l) {
        if (l.stav === 'bezi' && HRA.lhuty[l.id].udalost === u.id) l.stav = 'splnena';
      });
    }
    zapisDoDeniku(s, {
      nadpis: u.nadpis, volba: v.text, text: v.dusledek,
      citace: v.citace, hodnoceni: v.hodnoceni
    });
    s.otevrena = null;
    s.vysledek = { udalost: u.id, volba: i };
  }

  /* --- rozvrh --- */

  function podlePasma(tabulka, zaklad) {
    var p = tabulka[0];
    tabulka.forEach(function (r) { if (zaklad > r[0]) p = r; });
    return p[1] + p[2] * (zaklad - p[0]);
  }

  function spocitejRozvrh(s) {
    var o = HRA.odmena, f = s.flags;
    var halaDef = HRA.majetek.filter(function (m) { return m.zajisteni; })[0];
    var banka = veritelHry(halaDef.zajisteni).castka;
    var vytezekHaly = s.majetek[halaDef.id].vytezek || 0;
    var nZpen = f.hala_zpenezeni != null ? f.hala_zpenezeni : 155000;
    var nSpr = f.hala_sprava != null ? f.hala_sprava : 93000;
    var cista = Math.max(0, vytezekHaly - nZpen - nSpr);

    // Základ odměny ze zajištění je částka pro zajištěného věřitele včetně
    // odměny samotné (§ 1 odst. 1 věta druhá vyhlášky). Když na banku
    // nevyjde všechno, je základem celý čistý výtěžek; když vyjde a něco
    // zbude, je to rovnice, která se dořeší pár kroky.
    var odmZ = podlePasma(o.zajisteni, cista);
    if (cista - odmZ > banka) {
      odmZ = 0;
      for (var k = 0; k < 60; k += 1) odmZ = podlePasma(o.zajisteni, banka + odmZ);
    }
    odmZ = Math.round(odmZ);
    var proBanku = Math.min(banka, cista - odmZ);
    var prebytek = cista - odmZ - proBanku;

    var polozky = [];
    var obecna = 0;
    HRA.majetek.forEach(function (m) {
      if (m.zajisteni) return;
      var v = s.majetek[m.id].vytezek || 0;
      if (v) { polozky.push({ nazev: m.nazev, castka: v }); obecna += v; }
    });

    var nadRamec = f.nad_ramec != null ? f.nad_ramec : 31000;
    var sporu = s.pricti.naklady_sporu || 0;
    var naklady = HRA.naklady_spravy + nadRamec + sporu;
    var k_rozdeleni = obecna + prebytek - naklady;

    var odmN = Math.round(podlePasma(o.nezajisteni, Math.max(0, k_rozdeleni)));
    if (odmZ + odmN < o.minimum) odmN = o.minimum - odmZ;
    var zbyva = k_rozdeleni - odmN;

    var naRoven = [];
    var nezajisteni = [];
    HRA.veritele.forEach(function (v) {
      var st = s.veritele[v.id];
      if (st.skryty || !st.zjisteno) return;
      if (v.druh === 'na-roven') naRoven.push({ nazev: v.nazev, zjisteno: st.zjisteno });
      if (v.druh === 'nezajisteny') nezajisteni.push({ nazev: v.nazev, zjisteno: st.zjisteno });
    });
    naRoven.forEach(function (r) {
      r.vyplaceno = Math.max(0, Math.min(r.zjisteno, zbyva));
      zbyva -= r.vyplaceno;
    });
    var soucet = nezajisteni.reduce(function (a, r) { return a + r.zjisteno; }, 0);
    var podil = soucet ? Math.max(0, zbyva) / soucet : 0;
    nezajisteni.forEach(function (r) { r.vyplaceno = Math.round(r.zjisteno * podil); });

    return {
      vytezekHaly: vytezekHaly, nZpen: nZpen, nSpr: nSpr, cista: cista,
      odmZ: odmZ, proBanku: proBanku, banka: banka, prebytek: prebytek,
      polozky: polozky, obecna: obecna,
      nakladySpravy: HRA.naklady_spravy, nadRamec: nadRamec, sporu: sporu,
      kRozdeleni: k_rozdeleni, odmN: odmN,
      naRoven: naRoven, proNezajistene: Math.max(0, zbyva),
      nezajisteni: nezajisteni, soucet: soucet, podil: podil
    };
  }

  /* --- vykreslení --- */

  function citaceHry(citace) {
    var obal = el('div', 'hra-citace');
    (citace || []).forEach(function (c) {
      if (c.par) {
        var a = el('a', 'hra-cit',
          '§ ' + c.par + (c.odst ? ' odst. ' + c.odst : '') + (c.pism ? ' písm. ' + c.pism + ')' : ''));
        a.href = '#p' + c.par + (c.odst ? '-' + c.odst : '');
        a.addEventListener('click', function () { hraScroll = window.scrollY; });
        obal.appendChild(a);
      } else {
        obal.appendChild(el('span', 'hra-cit', c.text));
      }
    });
    return obal;
  }

  var VERDIKT = { spravne: 'Správně', chyba: 'Chyba', odlozeno: 'Odloženo' };

  function verdikt(h) {
    return VERDIKT[h] ? el('div', 'hra-verdikt ' + h, VERDIKT[h]) : null;
  }

  function kartaKalendare(s, prekresli) {
    var karta = el('section', 'hra-karta');
    karta.appendChild(el('div', 'stitek', 'Kalendář řízení'));
    var radek = el('div', 'hra-den-radek');
    radek.appendChild(el('span', 'hra-den', 'Den ' + s.den));
    radek.appendChild(el('span', 'hra-datum', fmtDatum(s.den, true)));
    karta.appendChild(radek);

    var bezici = s.lhuty.filter(function (l) { return l.stav === 'bezi'; })
      .sort(function (a, b) { return a.konec - b.konec; });

    function naleha(l) {
      var def = HRA.lhuty[l.id];
      if (def.termin) return '';
      var zbyva = l.konec - s.den;
      var delka = Math.max(1, l.konec - l.od);
      if (zbyva <= Math.max(1, delka * 0.2)) return 'kriticke';
      if (zbyva <= delka * 0.5) return 'pozor';
      return '';
    }

    var osa = el('div', 'hra-osa');
    osa.setAttribute('aria-hidden', 'true');
    var pomer = function (d) { return Math.min(100, 100 * d / HRA.konec.den) + '%'; };
    var plnost = el('div', 'hra-osa-dnes');
    plnost.style.width = pomer(s.den);
    osa.appendChild(plnost);
    bezici.forEach(function (l) {
      var z = el('div', 'hra-osa-znacka ' + naleha(l));
      z.style.left = pomer(l.konec);
      osa.appendChild(z);
    });
    karta.appendChild(osa);
    var popis = el('div', 'hra-osa-popis');
    popis.appendChild(el('span', null, fmtDatum(0)));
    popis.appendChild(el('span', null, 'konečná zpráva ' + fmtDatum(HRA.konec.den)));
    karta.appendChild(popis);

    var stoji = !!aktivniUdalost(s);
    var posun = el('div', 'hra-posun');
    function tlacitko(text, cil, hlavni) {
      var b = el('button', 'osa' + (hlavni ? ' osa-vybrana' : ''), text);
      b.type = 'button';
      b.disabled = stoji;
      b.addEventListener('click', function () {
        posunCas(s, cil);
        ulozHru();
        prekresli(true);
      });
      posun.appendChild(b);
    }
    var dalsi = dalsiZastaveni(s);
    tlacitko(dalsi >= HRA.konec.den
      ? 'Ke konečné zprávě → den ' + dalsi
      : 'Další událost → den ' + dalsi, dalsi, true);
    if (s.den + 7 < dalsi) tlacitko('+ 1 týden', s.den + 7);
    if (s.den + 30 < dalsi) tlacitko('+ 1 měsíc', s.den + 30);
    karta.appendChild(posun);
    if (stoji) karta.appendChild(el('p', 'hra-pozn', 'Čas stojí, dokud se nerozhodnete.'));

    if (bezici.length) {
      var seznam = el('div', 'hra-lhuty');
      bezici.forEach(function (l) {
        var def = HRA.lhuty[l.id];
        var r = el('div', 'hra-lhuta ' + naleha(l) +
          (def.kdo === 'vy' ? ' moje' : '') + (def.termin ? ' termin' : ''));
        r.appendChild(el('span', 'hra-lhuta-nazev', def.nazev));
        var zbyva = l.konec - s.den;
        r.appendChild(el('span', 'hra-lhuta-zbyva',
          zbyva === 0 ? (def.termin ? 'dnes' : 'končí dnes')
            : (def.termin ? 'za ' : 'zbývá ') + zbyva + (zbyva === 1 ? ' den' : zbyva < 5 ? ' dny' : ' dní')));
        r.appendChild(el('span', 'hra-lhuta-kdo',
          def.termin ? 'termín · ' + def.kdo
            : def.kdo === 'vy' ? 'jednat musíte vy' : 'lhůta běží: ' + def.kdo));
        r.appendChild(el('span', 'hra-lhuta-kdy', (def.termin ? '' : 'do ') + fmtDatum(l.konec, true)));
        seznam.appendChild(r);
      });
      karta.appendChild(seznam);
    }
    return karta;
  }

  function kartaUdalosti(s, u, prekresli) {
    var karta = el('section', 'hra-karta hra-udalost');
    karta.appendChild(el('div', 'stitek',
      s.otevrena ? 'Rozpracováno · od dne ' + u.den : 'Událost · den ' + s.den));
    karta.appendChild(el('h2', 'hra-udalost-nadpis', u.nadpis));
    var text = el('div', 'hra-text');
    vlozText(text, u.text);
    karta.appendChild(text);
    if (u.podklad) {
      var pod = el('div', 'hra-podklad');
      pod.appendChild(el('div', 'stitek', 'Podklady'));
      u.podklad.forEach(function (odst) { vlozText(pod, odst); });
      karta.appendChild(pod);
    }
    var volby = el('div', 'hra-volby');
    u.volby.forEach(function (v, i) {
      if (s.otevrena && v.odlozit) return;
      var b = el('button', 'hra-volba', v.text);
      b.type = 'button';
      b.addEventListener('click', function () {
        zvolHru(s, u, i);
        ulozHru();
        prekresli(true);
      });
      volby.appendChild(b);
    });
    karta.appendChild(volby);
    if (s.otevrena) {
      var akce = el('div', 'hra-akce');
      var zpet = el('button', 'drobny', 'Ještě ne — zavřít');
      zpet.type = 'button';
      zpet.addEventListener('click', function () {
        s.otevrena = null;
        ulozHru();
        prekresli(false);
      });
      akce.appendChild(zpet);
      karta.appendChild(akce);
    }
    return karta;
  }

  function kartaVysledku(s, prekresli) {
    var u = udalostHry(s.vysledek.udalost);
    var v = u.volby[s.vysledek.volba];
    var karta = el('section', 'hra-karta hra-udalost');
    karta.appendChild(el('div', 'stitek', 'Důsledek · den ' + s.den));
    karta.appendChild(el('h2', 'hra-udalost-nadpis', u.nadpis));
    karta.appendChild(el('p', 'hra-zvoleno', v.text));
    var vd = verdikt(v.hodnoceni);
    if (vd) karta.appendChild(vd);
    var text = el('div', 'hra-text');
    vlozText(text, v.dusledek);
    karta.appendChild(text);
    karta.appendChild(citaceHry(v.citace));
    var akce = el('div', 'hra-akce');
    var dal = el('button', 'poslat', 'Pokračovat');
    dal.type = 'button';
    dal.addEventListener('click', function () {
      s.vysledek = null;
      ulozHru();
      prekresli(false);
    });
    akce.appendChild(dal);
    karta.appendChild(akce);
    return karta;
  }

  function kartaRozpracovanych(s, prekresli) {
    var karta = el('section', 'hra-karta');
    karta.appendChild(el('div', 'stitek', 'Rozpracované'));
    s.odlozene.forEach(function (id) {
      var u = udalostHry(id);
      var lh = s.lhuty.filter(function (l) {
        return l.stav === 'bezi' && HRA.lhuty[l.id].udalost === id;
      })[0];
      var r = el('div', 'hra-radek');
      r.appendChild(el('span', 'hra-radek-nazev', u.nadpis));
      var b = el('button', 'rozbal', 'Otevřít');
      b.type = 'button';
      b.disabled = !!aktivniUdalost(s);
      b.addEventListener('click', function () {
        s.otevrena = id;
        s.vysledek = null;
        ulozHru();
        prekresli(true);
      });
      r.appendChild(b);
      if (lh) r.appendChild(el('span', 'hra-radek-stav', 'Lhůta do ' + fmtDatum(lh.konec, true)));
      karta.appendChild(r);
    });
    return karta;
  }

  function kartaMajetku(s) {
    var karta = el('section', 'hra-karta');
    karta.appendChild(el('div', 'stitek', 'Majetková podstata'));
    HRA.majetek.forEach(function (m) {
      var st = s.majetek[m.id];
      if (st.skryty) return;
      var r = el('div', 'hra-radek');
      r.appendChild(el('span', 'hra-radek-nazev', m.nazev));
      r.appendChild(el('span', 'hra-castka',
        st.vytezek ? kc(st.vytezek) : st.hodnota ? 'odhad ' + kc(st.hodnota) : '—'));
      r.appendChild(el('span', 'hra-radek-stav', st.stav));
      karta.appendChild(r);
    });
    return karta;
  }

  function kartaVeritelu(s) {
    var karta = el('section', 'hra-karta');
    karta.appendChild(el('div', 'stitek', 'Věřitelé'));
    var celkem = 0;
    HRA.veritele.forEach(function (v) {
      var st = s.veritele[v.id];
      if (st.skryty) return;
      // Částka se může během hry změnit — třeba když se pohledávka rozdělí.
      var castka = st.castka != null ? st.castka : v.castka;
      celkem += castka;
      var r = el('div', 'hra-radek');
      r.appendChild(el('span', 'hra-radek-nazev', v.nazev));
      r.appendChild(el('span', 'hra-castka', kc(castka)));
      r.appendChild(el('span', 'hra-radek-stav', st.stav));
      karta.appendChild(r);
    });
    var s2 = el('div', 'hra-radek soucet');
    s2.appendChild(el('span', 'hra-radek-nazev', 'Celkem uplatněno'));
    s2.appendChild(el('span', 'hra-castka', kc(celkem)));
    karta.appendChild(s2);
    return karta;
  }

  function kartaDeniku(s, nadpis) {
    var karta = el('section', 'hra-karta');
    karta.appendChild(el('div', 'stitek', nadpis || 'Deník spisu'));
    s.denik.slice().reverse().forEach(function (z) {
      var r = el('div', 'hra-denik-zaznam');
      r.appendChild(el('div', 'hra-denik-kdy',
        'Den ' + z.den + ' · ' + fmtDatum(z.den, true) + (z.nadpis ? ' · ' + z.nadpis : '')));
      if (z.volba) r.appendChild(el('p', 'hra-zvoleno', z.volba));
      var vd = verdikt(z.hodnoceni);
      if (vd) r.appendChild(vd);
      vlozText(r, z.text);
      if (z.citace && z.citace.length) r.appendChild(citaceHry(z.citace));
      karta.appendChild(r);

    var det = el('details', 'hra-zjednoduseni');
    det.appendChild(el('summary', null, 'Co hra zjednodušuje'));
    var ul = el('ul');

    karta.appendChild(det);
    var akce = el('div', 'hra-akce');

      if (!window.confirm('Opravdu začít znovu? Dosavadní postup se smaže.')) return;
      smazHru();
      hraStav = novyStavHry();
      ulozHru();
      prekresli(true);
    });
    akce.appendChild(znovu);
    karta.appendChild(akce);

  function radekRozvrhu(kam, nazev, castka, trida, stav) {

  function vykresliKonecHry(s, prekresli) {
    var R = spocitejRozvrh(s);
    hlavni.appendChild(el('div', 'p-cislo', 'Den ' + s.den + ' · ' + fmtDatum(s.den)));
    hlavni.appendChild(el('h1', 'p-nazev', HRA.konec.nadpis));
    var uvod = el('div', 'perex');
    vlozText(uvod, HRA.konec.text);
    hlavni.appendChild(uvod);

    var skore = el('div', 'hra-skore');
    function dlazdice(cislo, popis, hlavniD) {
      var d = el('div', 'hra-dlazdice' + (hlavniD ? ' hlavni' : ''));
      d.appendChild(el('div', 'hra-dlazdice-cislo', cislo));
      d.appendChild(el('div', 'hra-dlazdice-popis', popis));
      skore.appendChild(d);
    }
    dlazdice((R.podil * 100).toLocaleString('cs-CZ', { maximumFractionDigits: 1 }) + ' %',
      'dostanou nezajištění věřitelé', true);
    dlazdice(String(s.pocty.zmeskane), 'zmeškaných lhůt');
    dlazdice(String(s.pocty.prohrane), 'prohraných sporů' +
      (s.pocty.vyhrane ? ' (vyhraných ' + s.pocty.vyhrane + ')' : ''));
    dlazdice(String(s.pocty.chyby), 'chybných kroků');
    hlavni.appendChild(skore);

    var k1 = el('section', 'hra-karta');
    k1.appendChild(el('div', 'stitek', 'Hala — výtěžek zajištění'));
    radekRozvrhu(k1, 'Výtěžek prodeje haly', kc(R.vytezekHaly));
    radekRozvrhu(k1, 'Náklady zpeněžení', '− ' + kc(R.nZpen), 'odecet',
      R.nZpen > 0.05 * R.vytezekHaly ? 'nad 5 % se souhlasem banky' : 'nejvýše 5 %');
    radekRozvrhu(k1, 'Náklady správy', '− ' + kc(R.nSpr), 'odecet', 'nejvýše 4 %');
    radekRozvrhu(k1, 'Odměna správce ze zajištění', '− ' + kc(R.odmZ), 'odecet',
      'základ = částka pro banku + odměna');
    radekRozvrhu(k1, 'Banka Morava', kc(R.proBanku), null,
      R.proBanku >= R.banka ? 'uspokojena celá' : 'uspokojena z ' + Math.round(100 * R.proBanku / R.banka) + ' %');
    radekRozvrhu(k1, 'Přebytek pro ostatní věřitele', kc(R.prebytek), 'soucet');
    k1.appendChild(citaceHry([{ par: '298', odst: '2' }, { par: '298', odst: '4' },
      { par: '305', odst: '2' }, { text: '§ 1 odst. 2 vyhl. 313/2007 Sb.' }]));
    hlavni.appendChild(k1);

    var k2 = el('section', 'hra-karta');
    k2.appendChild(el('div', 'stitek', 'Obecná podstata a rozvrh'));
    R.polozky.forEach(function (p) { radekRozvrhu(k2, p.nazev, kc(p.castka)); });
    radekRozvrhu(k2, 'Přebytek z haly', kc(R.prebytek));
    radekRozvrhu(k2, 'Náklady správy podstaty', '− ' + kc(R.nakladySpravy), 'odecet', 'paušál hry');
    if (R.nadRamec) radekRozvrhu(k2, 'Náklady zpeněžení haly nad 5 %', '− ' + kc(R.nadRamec), 'odecet');
    if (R.sporu) radekRozvrhu(k2, 'Náhrada nákladů prohraných sporů', '− ' + kc(R.sporu), 'odecet');
    radekRozvrhu(k2, 'Odměna správce z obecné podstaty', '− ' + kc(R.odmN), 'odecet',
      'základ ' + kc(R.kRozdeleni) + ' včetně odměny a mezd');
    R.naRoven.forEach(function (r) {
      radekRozvrhu(k2, r.nazev, '− ' + kc(r.vyplaceno), 'odecet',
        r.vyplaceno >= r.zjisteno ? 'zaplaceno celé, před rozvrhem' : 'zaplaceno z části');
    });
    radekRozvrhu(k2, 'Zbývá nezajištěným věřitelům', kc(R.proNezajistene), 'soucet');
    k2.appendChild(citaceHry([{ par: '168', odst: '2' }, { par: '169', odst: '3' },
      { par: '305', odst: '1' }, { text: '§ 1 odst. 3 a 4 vyhl. 313/2007 Sb.' }]));
    hlavni.appendChild(k2);

    var k3 = el('section', 'hra-karta');
    k3.appendChild(el('div', 'stitek', 'Rozvrh mezi nezajištěné věřitele'));
    R.nezajisteni.forEach(function (r) {
      radekRozvrhu(k3, r.nazev, kc(r.vyplaceno), null, 'zjištěno ' + kc(r.zjisteno));
    });
    radekRozvrhu(k3, 'Celkem zjištěno ' + kc(R.soucet), kc(R.proNezajistene), 'soucet');
    k3.appendChild(citaceHry([{ par: '306', odst: '3' }]));
    hlavni.appendChild(k3);

    hlavni.appendChild(kartaDeniku(s, 'Jak spis běžel'));
    hlavni.appendChild(kartaZjednoduseni(prekresli));

  function vykresliHru() {
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaNazev.textContent = 'Hra';
    listaStav.textContent = '';

    if (!HRA) {
      hlavni.appendChild(el('p', 'prazdno', 'Hra se nenačetla.'));
      return;
    }
    if (!hraStav) hraStav = nactiHru() || novyStavHry();
    var s = hraStav;

    function prekresli(nahoru) {
      var y = window.scrollY;
      vykresliHru();
      window.scrollTo(0, nahoru ? 0 : y);
    }

    listaStav.textContent = 'den ' + s.den;

    if (s.konec) {
      vykresliKonecHry(s, prekresli);
      return;
    }

    hlavni.appendChild(el('div', 'p-cislo', 'Minihra · ' + HRA.spis));
    hlavni.appendChild(el('h1', 'p-nazev', HRA.nazev));
    if (s.den === 0 && !Object.keys(s.hotovo).length && !s.vysledek) {
      hlavni.appendChild(el('p', 'perex', HRA.perex));
    }

    var u = aktivniUdalost(s);
    if (s.vysledek) hlavni.appendChild(kartaVysledku(s, prekresli));
    else if (u) hlavni.appendChild(kartaUdalosti(s, u, prekresli));
    hlavni.appendChild(kartaKalendare(s, prekresli));
    if (s.odlozene.length) hlavni.appendChild(kartaRozpracovanych(s, prekresli));
    hlavni.appendChild(kartaMajetku(s));
    hlavni.appendChild(kartaVeritelu(s));
    hlavni.appendChild(kartaDeniku(s));
    hlavni.appendChild(kartaZjednoduseni(prekresli));
  }

  /* ---- směrování ------------------------------------------------------ */

  function smeruj() {
    zavriPanel();
    var h = location.hash.replace(/^#/, '');
    if (h === 'rozhovory') vykresliRozhovory();
    else if (h === 'pohledavky') vykresliPohledavky();
    else if (h === 'lhuty') vykresliLhuty();
    else if (h === 'hra') {
      vykresliHru();
      // Návrat z citace: vrátit se tam, kde hráč četl.
      if (hraScroll != null) { window.scrollTo(0, hraScroll); hraScroll = null; }
      else window.scrollTo(0, 0);
    }
    else if (h.indexOf('t') === 0) vykresliTema(h.slice(1));
    else if (h.indexOf('p') === 0) {
      // „p225-2" je paragraf 225 a v něm odstavec 2 (odkaz z citace ve hře).
      var cast = h.slice(1).split('-');
      vykresliParagraf(cast[0], cast[1]);
    }
    else vykresliObsah('');
  }

  zpetBtn.addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.hash = '';
  });
  window.addEventListener('hashchange', smeruj);
  smeruj();

  /* ---- schopnosti ----------------------------------------------------- */

  nastartujUlozeni();

  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(function (s) {
      sample = s;
      zivePrepinace.forEach(function (r) { r.prepni(); });
    }, function () {});
  }
})();
</script>
