<title>Insolvenční zákon v praxi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Paleta navazuje na tréninkovou appku (papír, inkoust, pečeť), aby to
     byl zjevně tentýž produkt. Přibyla jedna barva navíc: rozhovor.
     Zákon a výklad jsou teplé, dotazy na Claudea studené — ať je na první
     pohled poznat, kde končí předpis a kde začíná debata o něm. */
  :root {
    --papir: #FBF9F6;
    --plocha: #FFFFFF;
    --vyklad-plocha: #F3EEE7;
    --inkoust: #1A1714;
    --tlum: #857A70;
    --linka: #E5DED5;
    --pecet: #A85430;
    --rozhovor: #3A5876;
    --rozhovor-plocha: #EDF1F5;
    --stin: 0 1px 2px rgba(26, 23, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papir: #17150F;
      --plocha: #1F1C17;
      --vyklad-plocha: #252119;
      --inkoust: #EDE7DC;
      --tlum: #9A9084;
      --linka: #332F27;
      --pecet: #DC9068;
      --rozhovor: #9DBDDC;
      --rozhovor-plocha: #1C222A;
      --stin: none;
    }
  }
  :root[data-theme="dark"] {
    --papir: #17150F;
    --plocha: #1F1C17;
    --vyklad-plocha: #252119;
    --inkoust: #EDE7DC;
    --tlum: #9A9084;
    --linka: #332F27;
    --pecet: #DC9068;
    --rozhovor: #9DBDDC;
    --rozhovor-plocha: #1C222A;
    --stin: none;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--papir);
    color: var(--inkoust);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .obal { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ---- horní lišta ---------------------------------------------------- */
  .lista {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--papir) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linka);
    margin: 0 -1.25rem 1.5rem;
    padding: .7rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .zpet {
    appearance: none;
    border: 0;
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
    padding: .35rem 0;
  }
  .zpet:hover { color: var(--inkoust); }
  .lista-nazev {
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .lista-stav { margin-left: auto; font-size: .8rem; color: var(--tlum); font-variant-numeric: tabular-nums; }
  .tisk-tlacitko {
    appearance: none;
    border: 1px solid var(--linka);
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .82rem;
    border-radius: 999px;
    padding: .25rem .75rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .lista-stav + .tisk-tlacitko { margin-left: .5rem; }
  .tisk-tlacitko:hover { color: var(--inkoust); border-color: var(--tlum); }
  .tisk-tlacitko:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }

  .tisk-panel {
    border: 1px solid var(--linka);
    background: var(--plocha);
    border-radius: .75rem;
    padding: 1rem 1.1rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--stin);
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }
  .tisk-panel .stitek { margin-bottom: .1rem; }
  .tisk-volba {
    display: flex;
    align-items: baseline;
    gap: .55rem;
    font-size: .93rem;
    cursor: pointer;
  }
  .tisk-volba input { margin: 0; accent-color: var(--pecet); }
  .tisk-volba .kolik { color: var(--tlum); font-size: .84rem; }
  .tisk-akce { display: flex; gap: .5rem; align-items: center; margin-top: .35rem; }
  .tisk-akce .poslat { background: var(--pecet); }

  /* ---- obsah ---------------------------------------------------------- */
  .titul {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.12;
    text-wrap: balance;
    margin: .5rem 0 .6rem;
  }
  .perex { color: var(--tlum); font-size: .98rem; max-width: 38rem; margin: 0 0 1.5rem; }

  .hledani {
    width: 100%;
    font: inherit;
    color: var(--inkoust);
    background: var(--plocha);
    border: 1px solid var(--linka);
    border-radius: .65rem;
    padding: .7rem .9rem;
    box-shadow: var(--stin);
  }
  .hledani::placeholder { color: var(--tlum); }
  .hledani:focus-visible { outline: 2px solid var(--pecet); outline-offset: 1px; }

  .cast {
    margin: 2.2rem 0 .3rem;
    font-size: .74rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--pecet);
  }
  .hlava { margin: 1.2rem 0 .2rem; font-size: .85rem; color: var(--tlum); }

  .radek {
    display: grid;
    grid-template-columns: 3.4rem 1fr auto;
    align-items: baseline;
    gap: .8rem;
    width: 100%;
    text-align: left;
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--linka);
    background: none;
    color: inherit;
    font: inherit;
    padding: .7rem .25rem;
    cursor: pointer;
  }
  .radek:hover { background: var(--plocha); }
  .radek:focus-visible { outline: 2px solid var(--pecet); outline-offset: -2px; }
  .radek-cislo { font-weight: 600; color: var(--pecet); font-variant-numeric: tabular-nums; }
  .radek-nazev { font-size: .95rem; }
  .radek-znacka { font-size: .7rem; color: var(--linka); line-height: 1; }
  .radek-znacka.hotovo { color: var(--pecet); }
  .radek-znacka.castecne { color: var(--tlum); }

  .radek-tema { grid-template-columns: 1fr auto; }
  .radek-vlakno { grid-template-columns: 1fr auto; align-items: center; }
  .vlakno-nazev { display: block; font-size: .95rem; }
  .vlakno-kde {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: .15rem;

  }
  .radek-pramen { font-size: .78rem; color: var(--tlum); white-space: nowrap; }
  .bod-nadpis {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.22rem;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.25;
    text-wrap: balance;
    margin: 0 0 .1rem;
  }

  /* ---- paragraf ------------------------------------------------------- */
  .p-cislo {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--pecet);
    font-variant-numeric: tabular-nums;
  }
  .p-nazev {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.15;
    text-wrap: balance;
    margin: .25rem 0 .5rem;
  }
  .drobecky { font-size: .8rem; color: var(--tlum); margin: 0 0 2rem; }

  .odstavec { margin-bottom: 2.5rem; }

  /* Znění zákona patkově, všechno ostatní bezpatkově — typografie sama
     říká, kde mluví předpis a kde už někdo o předpisu. */
  .zneni {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.06rem;
    line-height: 1.6;
    white-space: pre-line;
    margin: 0;
  }
  .zneni-cislo { font-weight: 600; color: var(--pecet); font-family: "IBM Plex Sans", sans-serif; font-size: .95rem; }

  .vyklad {
    margin-top: 1rem;
    background: var(--vyklad-plocha);
    border-radius: .75rem;
    padding: 1.1rem 1.15rem;
  }
  .stitek {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--pecet);
    margin-bottom: .6rem;
  }
  .vyklad p { margin: 0 0 .8rem; font-size: .96rem; }
  .vyklad p:last-child { margin-bottom: 0; }
  .vyklad strong { font-weight: 600; }
  .chybi { margin-top: .9rem; font-size: .88rem; color: var(--tlum); font-style: italic; }

  /* ---- rozhovor ------------------------------------------------------- */
  /* Panel stojí na širokém displeji vedle textu, aby znění zákona zůstalo
     vidět, a na telefonu přes celou obrazovku, kde by sloupec neměl smysl. */
  .panel {
    position: fixed;
    z-index: 20;
    inset: 0;
    background: var(--plocha);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--linka);
  }
  .panel-zaves { display: none; }

  @media (min-width: 62rem) {
    .panel {
      inset: 0 0 0 auto;
      width: 25rem;
      box-shadow: -1px 0 0 var(--linka), -24px 0 48px rgba(26, 23, 20, .06);
    }
    body.s-panelem .obal { margin-right: 25rem; }
  }
  @media (max-width: 61.99rem) {
    .panel-zaves {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 19;
      background: rgba(26, 23, 20, .25);
    }
  }

  .panel-hlavicka {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .7rem .9rem .5rem;
    border-bottom: 1px solid var(--linka);
  }
  .panel-nazev {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--inkoust);
    background: none;
    border: 1px solid transparent;
    border-radius: .4rem;
    padding: .3rem .4rem;
  }
  .panel-nazev:hover:not(:disabled) { border-color: var(--linka); }
  .panel-nazev:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 0; }
  .panel-nazev::placeholder { color: var(--tlum); font-weight: 400; }
  .panel-zavrit {
    appearance: none;
    border: 0;
    background: none;
    color: var(--tlum);
    font-size: 1.05rem;
    line-height: 1;
    padding: .45rem .5rem;
    cursor: pointer;
    border-radius: .4rem;
  }
  .panel-zavrit:hover { color: var(--inkoust); background: var(--vyklad-plocha); }
  .panel-kde {
    appearance: none;
    border: 0;
    background: none;
    text-align: left;
    font: inherit;
    font-size: .8rem;
    color: var(--rozhovor);
    padding: .45rem .95rem .6rem;
    cursor: pointer;
    border-bottom: 1px solid var(--linka);
  }
  .panel-kde:hover { text-decoration: underline; }
  .panel-telo {
    flex: 1;
    overflow-y: auto;
    padding: 1rem .95rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }
  .panel .psani {
    border-top: 1px solid var(--linka);
    padding: .75rem .95rem 1rem;
    background: var(--plocha);
  }

  .rozbal {
    margin-top: .75rem;
    appearance: none;
    border: 1px solid var(--linka);
    background: none;
    color: var(--rozhovor);
    font: inherit;
    font-size: .88rem;
    border-radius: 999px;
    padding: .4rem .9rem;
    cursor: pointer;
  }
  .rozbal:hover { border-color: var(--rozhovor); }
  /* Místo, kde už rozhovor je, to dá znát i beze slov. */
  .rozbal-plny {
    border-color: var(--rozhovor);
    background: var(--rozhovor-plocha);
    font-weight: 500;
  }
  .rozbal:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 1px; }

  .bublina { font-size: .95rem; }
  .bublina .kdo {
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--rozhovor);
    display: block;
    margin-bottom: .2rem;
  }
  .bublina p { margin: 0 0 .7rem; }
  .bublina p:last-child { margin-bottom: 0; }
  .bublina.ja { color: var(--inkoust); }
  .bublina.ja .text {
    background: var(--rozhovor-plocha);
    border-radius: .6rem;
    padding: .6rem .75rem;
    display: block;
  }

  .vlakno { display: flex; flex-direction: column; gap: .75rem; }

  .stav-ulozeni { font-size: .78rem; color: var(--tlum); }
  .stav-ulozeni.varovne { color: var(--pecet); }

  .psani { display: flex; flex-direction: column; gap: .5rem; }
  .dotaz {
    width: 100%;
    font: inherit;
    font-size: .95rem;
    color: var(--inkoust);
    background: var(--plocha);
    border: 1px solid var(--linka);
    border-radius: .6rem;
    padding: .6rem .75rem;
    resize: vertical;
    min-height: 4.5rem;
  }
  .dotaz:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 1px; }
  .nastroje { display: flex; gap: .5rem; align-items: center; }
  .poslat {
    appearance: none;
    border: 0;
    background: var(--rozhovor);
    color: var(--papir);
    font: inherit;
    font-size: .9rem;
    font-weight: 500;
    border-radius: 999px;
    padding: .45rem 1.1rem;
    cursor: pointer;
  }
  .poslat[disabled] { opacity: .45; cursor: default; }
  .poslat:focus-visible { outline: 2px solid var(--rozhovor); outline-offset: 2px; }
  .drobny {
    appearance: none;
    border: 0;
    background: none;
    color: var(--tlum);
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
    padding: .45rem .3rem;
  }
  .drobny:hover { color: var(--inkoust); }
  .potiz { font-size: .85rem; color: var(--pecet); }

  /* ---- přechod -------------------------------------------------------- */
  .prechod {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--linka);
  }
  .prechod button {
    appearance: none;
    border: 0;
    background: none;
    color: var(--pecet);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
    padding: .3rem 0;
    font-variant-numeric: tabular-nums;
  }
  .prechod button:hover { text-decoration: underline; }

  .prazdno { color: var(--tlum); padding: 2rem 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---- tisk ------------------------------------------------------------
     Na papír se nekreslí obrazovka, ale vlastní sazba: žádné plochy (jsou
     to litry inkoustu a na tiskárně stejně vypadnou), místo nich linky.
     Rozlišení patkové/bezpatkové zůstává — na papíře nese stejnou informaci
     jako na displeji, tedy kde mluví zákon a kde už někdo o zákoně. */
  .tisk { display: none; }

  @media print {
    @page { margin: 18mm 16mm 20mm; }
    html, body { background: #FFF; color: #000; }
    .obal, .panel, .panel-zaves { display: none; }
    body.s-panelem .obal { margin-right: 0; }
    .tisk { display: block; }

    .tisk {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 9.5pt;
      line-height: 1.45;
      color: #000;
      orphans: 3;
      widows: 3;
    }
    .t-hlavicka { border-bottom: 1.5pt solid #000; padding-bottom: 6pt; margin-bottom: 16pt; }
    .t-nadpis {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 17pt;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .t-podnadpis { font-size: 8pt; color: #444; margin-top: 3pt; }

    .t-paragraf { break-before: page; }
    .t-paragraf:first-of-type { break-before: avoid; }
    .t-paragraf-cislo {
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .t-paragraf-nazev {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 14pt;
      font-weight: 600;
      line-height: 1.15;
      margin: 1pt 0 2pt;
      break-after: avoid;
    }
    .t-drobecky { font-size: 7.5pt; color: #555; margin-bottom: 12pt; }

    .t-odstavec { margin-bottom: 14pt; }
    .t-bod-nadpis {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 11.5pt;
      font-weight: 600;
      line-height: 1.2;
      margin: 0 0 4pt;
      break-after: avoid;
    }
    .t-zneni {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 10pt;
      line-height: 1.4;
      white-space: pre-line;
      margin: 0;
      break-after: avoid;
    }
    .t-zneni-cislo { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 9pt; }

    .t-vyklad { margin: 7pt 0 0 0; padding-left: 9pt; border-left: 2pt solid #000; }
    .t-stitek {
      display: block;
      font-size: 7pt;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 3pt;
    }
    .t-vyklad p { margin: 0 0 5pt; }
    .t-vyklad p:last-child { margin-bottom: 0; }
    .t-chybi { margin: 6pt 0 0; font-size: 8.5pt; color: #666; font-style: italic; }

    /* Rozhovor dostane tečkovanou linku, aby se na první pohled odlišil od
       výkladu — na papíře nemáme barvu, která to dělá na displeji. */
    .t-rozhovor { margin: 7pt 0 0 0; padding-left: 9pt; border-left: 1pt dotted #000; }
    .t-kdo {
      font-size: 7pt;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 2pt;
      break-after: avoid;
    }
    .t-bublina { margin-bottom: 6pt; break-inside: avoid; }
    .t-bublina:last-child { margin-bottom: 0; }
    .t-bublina p { margin: 0 0 4pt; }
    .t-bublina p:last-child { margin-bottom: 0; }
    .t-bublina.ja p { font-style: italic; }

    .t-patka { margin-top: 18pt; padding-top: 5pt; border-top: .5pt solid #999; font-size: 7.5pt; color: #555; }
  }
</style>

<div class="obal">
  <div class="lista">
    <button class="zpet" id="zpet" hidden>← Obsah</button>

<script src="vyklad.js"></script>
<script src="temata.js"></script>
<script>
(function () {
  'use strict';

  var ZAKON = window.ZAKON || [];
  var VYKLAD = window.VYKLAD || {};
  var TEMATA = window.TEMATA || [];
  var BEZ_CISLA = '-';

  // Schopnosti dorazí až po chvíli a nemusí dorazit vůbec (jiný prohlížeč,
  // nepovolený přístup). Stránka se vykreslí bez nich a diskuze se rozsvítí,
  // až když se ozvou.
  var sample = null;

  var hlavni = document.getElementById('hlavni');
  var zpetBtn = document.getElementById('zpet');
  var listaNazev = document.getElementById('lista-nazev');
  var listaStav = document.getElementById('lista-stav');

  var podleCisla = {};
  ZAKON.forEach(function (p) { podleCisla[p.paragraf] = p; });

  /* ---- pomocné ------------------------------------------------------- */

  function bezDiakritiky(t) {
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function klicOdstavce(o) { return o.cislo || BEZ_CISLA; }

  function vykladOdstavce(p, o) {
    var k = VYKLAD[p.paragraf];
    return (k && k[klicOdstavce(o)]) || null;
  }

  function vylozeno(p) {
    return p.odstavce.filter(function (o) { return vykladOdstavce(p, o); }).length;
  }

  // Id dokumentu v úložišti. Musí projít gramatikou cest, proto podtržítko
  // místo mezery a „x" pro odstavec bez čísla.
  function klicDiskuze(p, o) {
    return p.paragraf + '-' + (o.cislo || 'x');
  }

  function el(tag, trida, text) {
    var e = document.createElement(tag);
    if (trida) e.className = trida;
    if (text != null) e.textContent = text;
    return e;
  }

  /** Text s prázdnými řádky mezi odstavci a **tučnými** úseky. */
  function vlozText(kam, text) {
    text.split('\n\n').forEach(function (odst) {
      var p = el('p');
      odst.split('**').forEach(function (usek, i) {
        if (i % 2) p.appendChild(el('strong', null, usek));
        else if (usek) p.appendChild(document.createTextNode(usek));
      });
      kam.appendChild(p);
    });
  }

  /* ---- obsah --------------------------------------------------------- */

  function hledej(dotaz) {
    var h = bezDiakritiky(dotaz).trim();
    if (!h) return null;
    var cislo = h.replace(/^§\s*/, '');
    if (/^\d+[a-z]?$/.test(cislo)) {
      return ZAKON.filter(function (p) { return p.paragraf === cislo; })
        .concat(ZAKON.filter(function (p) {
          return p.paragraf !== cislo && p.paragraf.indexOf(cislo) === 0;
        }));
    }
    var nalez = [];
    ZAKON.forEach(function (p) {
      var vNazvu = p.nazev && bezDiakritiky(p.nazev).indexOf(h) >= 0;
      var vTextu = p.odstavce.some(function (o) {
        return bezDiakritiky(o.text).indexOf(h) >= 0;
      });
      if (vNazvu || vTextu) nalez.push({ p: p, vNazvu: !!vNazvu });
    });
    nalez.sort(function (a, b) { return (b.vNazvu ? 1 : 0) - (a.vNazvu ? 1 : 0); });
    return nalez.slice(0, 60).map(function (n) { return n.p; });
  }

  function radekParagrafu(p) {
    var b = el('button', 'radek');
    b.type = 'button';
    b.appendChild(el('span', 'radek-cislo', '§ ' + p.paragraf));
    var nazev = p.nazev || p.odstavce[0].text.replace(/\s+/g, ' ').slice(0, 70) + '…';
    b.appendChild(el('span', 'radek-nazev', nazev));
    var hotovo = vylozeno(p);
    var stav = hotovo === p.odstavce.length ? 'hotovo' : hotovo ? 'castecne' : '';
    b.appendChild(el('span', 'radek-znacka ' + stav,
      hotovo === p.odstavce.length ? '●' : hotovo ? '◐' : '○'));
    b.addEventListener('click', function () { location.hash = '#p' + p.paragraf; });
    return b;
  }

  function vykresliObsah(dotaz) {
    hlavni.textContent = '';
    zpetBtn.hidden = true;
    listaNazev.textContent = 'Insolvenční zákon';

    var celkem = 0, hotovo = 0;
    ZAKON.forEach(function (p) { celkem += p.odstavce.length; hotovo += vylozeno(p); });
    listaStav.textContent = hotovo + ' / ' + celkem + ' odst.';

    hlavni.appendChild(el('h1', 'titul', 'Insolvenční zákon v praxi'));
    hlavni.appendChild(el('p', 'perex',
      'Znění zákona č. 182/2006 Sb. podle Sbírky, pod každým odstavcem výklad, ' +
      'co znamená v práci správce — a možnost se k němu rovnou zeptat.'));

    var pole = el('input', 'hledani');
    pole.type = 'search';
    pole.placeholder = 'Číslo paragrafu nebo slovo';
    pole.setAttribute('aria-label', 'Hledat v zákoně');
    pole.autocomplete = 'off';
    if (dotaz) pole.value = dotaz;
    hlavni.appendChild(pole);

    var vypis = el('div');
    hlavni.appendChild(vypis);

    function radekTematu(t) {
      var b = el('button', 'radek radek-tema');
      b.type = 'button';
      b.appendChild(el('span', 'radek-nazev', t.nazev));
      b.appendChild(el('span', 'radek-pramen', t.pramen));
      b.addEventListener('click', function () { location.hash = '#t' + t.id; });
      return b;
    }

    function prekresli(text) {
      vypis.textContent = '';
      var nalez = hledej(text || '');
      if (nalez) {
        var h = bezDiakritiky(text || '').trim();
        var temata = h.length > 1 ? TEMATA.filter(function (t) {
          return bezDiakritiky(t.nazev + ' ' + t.pramen + ' ' +
            t.body.map(function (b) { return b.nadpis + ' ' + b.text; }).join(' ')
          ).indexOf(h) >= 0;
        }) : [];
        if (temata.length) {
          vypis.appendChild(el('h2', 'cast', 'Mimo insolvenční zákon'));
          temata.forEach(function (t) { vypis.appendChild(radekTematu(t)); });
          if (nalez.length) vypis.appendChild(el('h2', 'cast', 'Insolvenční zákon'));
        }
        if (!nalez.length && !temata.length) {
          vypis.appendChild(el('p', 'prazdno', 'Nic takového tu není.'));
          return;
        }
        nalez.forEach(function (p) { vypis.appendChild(radekParagrafu(p)); });
        return;
      }
      if (TEMATA.length) {
        vypis.appendChild(el('h2', 'cast', 'Mimo insolvenční zákon'));
        var oblast = null;
        TEMATA.forEach(function (t) {
          if (t.oblast !== oblast) {
            oblast = t.oblast;
            vypis.appendChild(el('h3', 'hlava', oblast));
          }
          vypis.appendChild(radekTematu(t));
        });
      }

      var cast = null, hlava = null;
      ZAKON.forEach(function (p) {
        if (p.cast !== cast) {
          cast = p.cast;
          hlava = null;
          vypis.appendChild(el('h2', 'cast', cast));
        }
        if (p.hlava !== hlava) {
          hlava = p.hlava;
          if (hlava) vypis.appendChild(el('h3', 'hlava', hlava));
        }
        vypis.appendChild(radekParagrafu(p));
      });
    }

    var casovac;
    pole.addEventListener('input', function () {
      clearTimeout(casovac);
      casovac = setTimeout(function () { prekresli(pole.value); }, 120);
    });
    prekresli(dotaz || '');
  }

  /* ---- rozhovor pod odstavcem ---------------------------------------- */

  /* ---- ukládání rozhovorů ---------------------------------------------
     Dvě vrstvy, a to schválně. Prohlížeč drží rozhovor hned a bez ptaní,
     takže přežije obnovení stránky i tehdy, když se serverem něco je.
     Server je navíc — díky němu je rozhovor vidět i na druhém zařízení.
     Když server nejde, neschovává se to: panel to napíše. Tiché selhání
     vypadá přesně jako „nic se neukládá", a to je horší než chybová hláška. */

  var PREDPONA = 'iz-rozhovor-';

  var ulozeni = {
    db: null,
    stav: 'ceka',   // 'ceka' | 'server' | 'jen-zde'
    duvod: '',
    vlakna: {}      // klíč odstavce → {paragraf, odstavec, zpravy, zmeneno}
  };

  function zLokalniho(klic) {
    try {
      var s = localStorage.getItem(PREDPONA + klic);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  function doLokalniho(klic, zaznam) {
    try { localStorage.setItem(PREDPONA + klic, JSON.stringify(zaznam)); }
    catch (e) { /* plné nebo zakázané úložiště — snad to vezme server */ }
  }

  function vsechnoZLokalniho() {
    var mapa = {};
    try {
      for (var i = 0; i < localStorage.length; i += 1) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PREDPONA) === 0) {
          var z = zLokalniho(k.slice(PREDPONA.length));
          if (z && z.zpravy && z.zpravy.length) mapa[k.slice(PREDPONA.length)] = z;
        }
      }
    } catch (e) { /* soukromé okno, zakázané úložiště */ }
    return mapa;
  }

  function nastavStav(stav, duvod) {
    ulozeni.stav = stav;
    ulozeni.duvod = duvod || '';
    ozviSeVlaknum();
  }

  /** Uloží vlákno — nejdřív do prohlížeče, pak na server, jde-li to. */
  function ulozVlakno(klic, zpravy, nazev) {
    var puvodni = ulozeni.vlakna[klic];
    var zaznam = {
      misto: klic,
      nazev: nazev || (puvodni && puvodni.nazev) || '',
      zpravy: zpravy.slice(),
      zmeneno: Date.now()
    };
    ulozeni.vlakna[klic] = zaznam;
    doLokalniho(klic, zaznam);

    if (!ulozeni.db) return Promise.resolve();
    return ulozeni.db.doc('data/users/me/' + klic).set(zaznam).then(function () {
      if (ulozeni.stav !== 'server') nastavStav('server', '');
    }, function (e) {
      nastavStav('jen-zde', (e && e.code) || 'zápis se nepodařil');
    });
  }

  function smazVlakno(klic) {
    delete ulozeni.vlakna[klic];
    try { localStorage.removeItem(PREDPONA + klic); } catch (e) {}
    if (ulozeni.db) {
      ulozeni.db.doc('data/users/me/' + klic).delete().then(null, function () {});
    }
  }

  function popisNedostupnosti(perm) {
    if (!perm) return Promise.resolve('úložiště není k dispozici');
    return perm.state('db').then(function (stav) {
      if (stav === 'denied') return 'ukládání jsi při načtení odmítl — načti stránku znovu';
      if (stav === 'prompt') return 'ukládání zatím není povolené';
      if (stav === 'unavailable') return 'úložiště tu není k dispozici';
      return 'na server se to teď nedaří';
    }, function () { return 'úložiště není k dispozici'; });
  }

  function nastartujUlozeni() {
    // Co je v prohlížeči, je k dispozici hned — ještě než se ozve server.
    ulozeni.vlakna = vsechnoZLokalniho();
    ozviSeVlaknum();

    if (!(window.claude && window.claude.use)) {
      nastavStav('jen-zde', 'stránka běží mimo Claude');
      return;
    }

    window.claude.use('db').then(function (d) {
      if (!d) {
        return window.claude.use('permissions')
          .then(popisNedostupnosti, function () { return 'úložiště není k dispozici'; })
          .then(function (duvod) { nastavStav('jen-zde', duvod); });
      }
      ulozeni.db = d;
      // Jedno hromadné načtení místo dotazu u každého odstavce zvlášť.
      return d.collection('data/users/me').get().then(function (snap) {
        (snap.docs || []).forEach(function (doc) {
          var data = doc.data();
          if (!data || !Array.isArray(data.zpravy) || !data.zpravy.length) return;
          var mistni = ulozeni.vlakna[doc.id];
          // Novější vyhrává; bez razítka bere přednost server.
          if (!mistni || (data.zmeneno || 0) >= (mistni.zmeneno || 0)) {
            ulozeni.vlakna[doc.id] = data;
            doLokalniho(doc.id, data);
          }
        });
        nastavStav('server', '');
      });
    }).then(null, function (e) {
      nastavStav('jen-zde', (e && e.code) || 'na server se nepodařilo připojit');
    });
  }

  /* ---- rozhovor pod odstavcem ---------------------------------------- */

  function kontext(p, o, vyklad) {
    return [
      'Jsi asistent pro přípravu na obecnou zkoušku insolvenčního správce v ČR.',
      'Uživatel čte insolvenční zákon (č. 182/2006 Sb.) po odstavcích a ptá se na konkrétní místo.',
      '',
      'Odpovídej česky, stručně a prakticky — v rovině toho, co to znamená pro práci správce.',
      'Kde si nejsi jistý, řekni to. Neuváděj paragrafy, které si nepamatuješ přesně.',
      'Nepiš úvodní zdvořilosti, jdi rovnou k věci.',
      '',
      '--- MÍSTO V ZÁKONĚ ---',
      '§ ' + p.paragraf + (p.nazev ? ' — ' + p.nazev : ''),
      p.cast + (p.hlava ? ' · ' + p.hlava : '') + (p.dil ? ' · ' + p.dil : ''),
      '',
      'Znění' + (o.cislo ? ' odstavce ' + o.cislo : '') + ':',
      o.text,
      '',
      vyklad ? '--- VÝKLAD, KTERÝ UŽIVATEL PRÁVĚ ČETL ---\n' + vyklad
             : '--- K tomuto odstavci zatím žádný výklad napsaný není. ---',
      '--- KONEC KONTEXTU ---'
    ].join('\n');
  }

  /* ---- rozhovor v postranním panelu -------------------------------------
     Rozhovorů bude hodně a vmáčknuté pod odstavec se v nich nedalo vyznat.
     Vedle textu proto stojí jeden sdílený panel: na širokém displeji jako
     sloupec vedle zákona (znění zůstane vidět), na telefonu přes celou
     obrazovku. Vlákno má název — sám se navrhne z první otázky a dá se
     přepsat — a všechna se pak dají najít v přehledu.

     V místě samotném zbyde jen tlačítko, které ukazuje, jestli tam nějaký
     rozhovor je a jak se jmenuje. */

  var panel = null;   // { klic, kontext, popis, cil, ... } právě otevřené vlákno

  /** Název, který se nabídne, než si ho pojmenuje sám. */
  function odvozenyNazev(zpravy) {
    var prvni = null;
    for (var i = 0; i < zpravy.length; i += 1) {
      if (zpravy[i].role === 'user') { prvni = zpravy[i].text; break; }
    }
    if (!prvni) return '';
    var jedna = prvni.replace(/\s+/g, ' ').trim();
    return jedna.length > 48 ? jedna.slice(0, 48).replace(/\s+\S*$/, '') + '…' : jedna;
  }

  function nazevVlakna(klic) {
    var z = ulozeni.vlakna[klic];
    if (!z) return '';
    return z.nazev || odvozenyNazev(z.zpravy || []);
  }

  function pocetZprav(klic) {
    var z = ulozeni.vlakna[klic];
    return z && z.zpravy ? z.zpravy.length : 0;
  }

  /* --- tlačítko, které v místě zůstane --- */

  function rozhovorProMisto(klic, kontextText, popisMista) {
    var obal = el('div');
    var tlacitko = el('button', 'rozbal');
    tlacitko.type = 'button';
    obal.appendChild(tlacitko);

    function prekresli() {
      var kolik = pocetZprav(klic);
      if (kolik) {
        tlacitko.classList.add('rozbal-plny');
        tlacitko.textContent = nazevVlakna(klic) + '  · ' + kolik;
      } else {
        tlacitko.classList.remove('rozbal-plny');
        tlacitko.textContent = 'Zeptat se na tohle místo';
      }
      obal.hidden = !sample && !kolik;
    }

    tlacitko.addEventListener('click', function () {
      otevriPanel(klic, kontextText, popisMista);
    });

    obal.obnov = prekresli;
    obal.prepni = prekresli;
    obal.klicMista = klic;
    obal.otevri = function () { otevriPanel(klic, kontextText, popisMista); };
    prekresli();
    return obal;
  }

  /* --- samotný panel --- */

  function postavPanel() {
    if (panel) return panel;

    var korpus = el('aside', 'panel');
    korpus.setAttribute('aria-label', 'Rozhovor');
    korpus.hidden = true;

    var hlavicka = el('div', 'panel-hlavicka');
    var nadpis = el('input', 'panel-nazev');
    nadpis.setAttribute('aria-label', 'Název rozhovoru');
    nadpis.placeholder = 'Pojmenuj rozhovor';
    var zavrit = el('button', 'panel-zavrit');
    zavrit.type = 'button';
    zavrit.setAttribute('aria-label', 'Zavřít rozhovor');
    zavrit.textContent = '✕';
    hlavicka.appendChild(nadpis);
    hlavicka.appendChild(zavrit);
    korpus.appendChild(hlavicka);

    var kde = el('button', 'panel-kde');
    kde.type = 'button';
    kde.addEventListener('click', function () {
      // Z přehledu se dá panel otevřít, aniž by se stránka přepnula; tohle
      // na to místo doskočí.
      if (panel && panel.klic) {
        var m = mistoVlakna(panel.klic);
        if (m && location.hash !== m.hash) location.hash = m.hash;
      }
    });
    korpus.appendChild(kde);

    var telo = el('div', 'panel-telo');
    var vlakno = el('div', 'vlakno');
    telo.appendChild(vlakno);
    var potiz = el('div', 'potiz');
    potiz.hidden = true;
    telo.appendChild(potiz);
    var stavUlozeni = el('div', 'stav-ulozeni');
    telo.appendChild(stavUlozeni);
    korpus.appendChild(telo);

    var psani = el('div', 'psani');
    var pole = el('textarea', 'dotaz');
    pole.placeholder = 'Na co se chceš zeptat?';
    pole.setAttribute('aria-label', 'Dotaz');
    var nastroje = el('div', 'nastroje');
    var poslat = el('button', 'poslat');
    poslat.type = 'button';
    poslat.textContent = 'Zeptat se';
    var smazat = el('button', 'drobny');
    smazat.type = 'button';
    smazat.textContent = 'Smazat';
    nastroje.appendChild(poslat);
    nastroje.appendChild(smazat);
    psani.appendChild(pole);
    psani.appendChild(nastroje);
    korpus.appendChild(psani);

    var zaves = el('div', 'panel-zaves');
    zaves.hidden = true;
    zaves.addEventListener('click', zavriPanelRozhovoru);

    document.body.appendChild(zaves);
    document.body.appendChild(korpus);

    panel = {
      korpus: korpus, zaves: zaves, nadpis: nadpis, kde: kde,
      vlakno: vlakno, potiz: potiz, stav: stavUlozeni,
      pole: pole, poslat: poslat, smazat: smazat,
      klic: null, kontext: '', zpravy: [], bezi: false
    };

    zavrit.addEventListener('click', zavriPanelRozhovoru);
    poslat.addEventListener('click', odesliZPanelu);
    smazat.addEventListener('click', function () {
      if (!panel.klic) return;
      smazVlakno(panel.klic);
      panel.zpravy = [];
      vykresliPanel(null);
      ozviSeVlaknum();
    });
    pole.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') odesliZPanelu();
    });
    nadpis.addEventListener('change', function () {
      if (!panel.klic || !panel.zpravy.length) return;
      ulozVlakno(panel.klic, panel.zpravy, nadpis.value.trim());
      ozviSeVlaknum();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel && !panel.korpus.hidden) zavriPanelRozhovoru();
    });

    return panel;
  }

  function otevriPanel(klic, kontextText, popisMista) {
    var p = postavPanel();
    p.klic = klic;
    p.kontext = kontextText;
    p.popis = popisMista || '';
    p.cil = location.hash;
    var z = ulozeni.vlakna[klic];
    p.zpravy = z && z.zpravy ? z.zpravy.slice() : [];
    p.nadpis.value = nazevVlakna(klic);
    p.kde.textContent = p.popis;
    p.kde.hidden = !p.popis;
    p.potiz.hidden = true;
    p.korpus.hidden = false;
    p.zaves.hidden = false;
    document.body.classList.add('s-panelem');
    vykresliPanel(null);
    p.pole.focus();
  }

  function zavriPanelRozhovoru() {
    if (!panel) return;
    panel.korpus.hidden = true;
    panel.zaves.hidden = true;
    panel.klic = null;
    document.body.classList.remove('s-panelem');
  }

  function vykresliPanel(rozepsana) {
    if (!panel) return;
    var p = panel;
    p.vlakno.textContent = '';
    p.zpravy.forEach(function (z) {
      var b = el('div', 'bublina ' + (z.role === 'user' ? 'ja' : 'claude'));
      b.appendChild(el('span', 'kdo', z.role === 'user' ? 'Já' : 'Claude'));
      if (z.role === 'user') b.appendChild(el('span', 'text', z.text));
      else vlozText(b, z.text);
      p.vlakno.appendChild(b);
    });
    if (rozepsana != null) {
      var b2 = el('div', 'bublina claude');
      b2.appendChild(el('span', 'kdo', 'Claude'));
      if (rozepsana) vlozText(b2, rozepsana);
      else b2.appendChild(el('p', null, 'Přemýšlí…'));
      p.vlakno.appendChild(b2);
    }
    p.smazat.hidden = p.zpravy.length === 0;
    p.nadpis.disabled = p.zpravy.length === 0;
    if (!p.nadpis.value) p.nadpis.value = odvozenyNazev(p.zpravy);

    if (!p.zpravy.length || ulozeni.stav === 'ceka') {
      p.stav.hidden = true;
    } else {
      p.stav.hidden = false;
      if (ulozeni.stav === 'server') {
        p.stav.className = 'stav-ulozeni';
        p.stav.textContent = 'Uloženo — uvidíš to i na jiném zařízení.';
      } else {
        p.stav.className = 'stav-ulozeni varovne';
        p.stav.textContent = 'Uloženo jen v tomhle prohlížeči: ' + ulozeni.duvod + '.';
      }
    }
    p.vlakno.parentNode.scrollTop = p.vlakno.parentNode.scrollHeight;
  }

  function odesliZPanelu() {
    var p = panel;
    if (!p || !p.klic) return;
    var text = p.pole.value.trim();
    if (!text || p.bezi || !sample) return;
    p.bezi = true;
    p.potiz.hidden = true;
    p.poslat.disabled = true;
    p.pole.value = '';
    p.zpravy.push({ role: 'user', text: text });
    vykresliPanel('');
    ulozVlakno(p.klic, p.zpravy, p.nadpis.value.trim());
    ozviSeVlaknum();

    var klicTehdy = p.klic;
    var tahy = p.zpravy.map(function (z, i) {
      return {
        role: z.role,
        content: i === 0 && z.role === 'user'
          ? p.kontext + '\n\nOtázka: ' + z.text
          : z.text
      };
    });

    sample(tahy, {
      cache: false,
      onText: function (u) { if (panel.klic === klicTehdy) vykresliPanel(u.text); }
    }).then(function (v) {
      p.zpravy.push({ role: 'assistant', text: v.text });
      if (panel.klic === klicTehdy) vykresliPanel(null);
      ulozVlakno(klicTehdy, p.zpravy, p.nadpis.value.trim());
      ozviSeVlaknum();
    }, function (e) {
      p.zpravy.pop();
      if (panel.klic === klicTehdy) vykresliPanel(null);
      ulozVlakno(klicTehdy, p.zpravy, p.nadpis.value.trim());
      ozviSeVlaknum();
      p.potiz.hidden = false;
      p.potiz.textContent =
        e && e.code === 'rate_limited' ? 'Moc dotazů za sebou. Zkus to za chvíli.'
        : e && e.code === 'not_granted' ? 'Dotazy na Claudea tady nejsou povolené.'
        : 'Nepovedlo se to odeslat. Zkus to znovu.';
    }).then(function () {
      p.bezi = false;
      p.poslat.disabled = false;
    });
  }

  /* ---- přehled rozhovorů ---------------------------------------------- */

  /** Kde vlákno patří — z klíče se dá zpětně určit místo i popis. */
  function mistoVlakna(klic) {
    if (klic.indexOf('t-') === 0) {
      var zbytek = klic.slice(2);
      var del = zbytek.lastIndexOf('-');
      var t = tematPodleId(zbytek.slice(0, del));
      var i = Number(zbytek.slice(del + 1));
      if (!t || !t.body[i]) return null;
      return {
        druh: 'tema',
        hash: '#t' + t.id,
        kde: t.nazev,
        bod: t.body[i].nadpis
      };
    }
    var del2 = klic.lastIndexOf('-');
    var cislo = klic.slice(0, del2);
    var odst = klic.slice(del2 + 1);
    var p = podleCisla[cislo];
    if (!p) return null;
    return {
      druh: 'zakon',
      hash: '#p' + cislo,
      kde: '§ ' + cislo + (p.nazev ? ' — ' + p.nazev : ''),
      bod: odst === 'x' ? '' : 'odstavec ' + odst
    };
  }

  function vykresliRozhovory() {
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaNazev.textContent = 'Moje rozhovory';
    listaStav.textContent = '';
    zavriPanelRozhovoru();

    hlavni.appendChild(el('h1', 'titul', 'Moje rozhovory'));

    var klice = Object.keys(ulozeni.vlakna).filter(function (k) {
      var z = ulozeni.vlakna[k];
      return z && z.zpravy && z.zpravy.length;
    });

    if (!klice.length) {
      hlavni.appendChild(el('p', 'perex',
        'Zatím žádný. Otevři si kterýkoli odstavec nebo téma a zeptej se — ' +
        'rozhovor dostane název a najdeš ho potom tady.'));
      return;
    }

    hlavni.appendChild(el('p', 'perex',
      klice.length + (klice.length === 1 ? ' rozhovor' :
        klice.length < 5 ? ' rozhovory' : ' rozhovorů') +
      '. Nejnovější nahoře; klikni a otevře se tam, kde vznikl.'));

    var hledaci = el('input', 'hledani');
    hledaci.type = 'search';
    hledaci.placeholder = 'Hledat v mých rozhovorech';
    hledaci.setAttribute('aria-label', 'Hledat v rozhovorech');
    hledaci.autocomplete = 'off';
    hlavni.appendChild(hledaci);

    var vypis = el('div');
    hlavni.appendChild(vypis);

    function prekresli(dotaz) {
      vypis.textContent = '';
      var h = bezDiakritiky(dotaz || '').trim();
      var radky = klice.map(function (k) {
        return { klic: k, zaznam: ulozeni.vlakna[k], misto: mistoVlakna(k) };
      }).filter(function (r) {
        if (!r.misto) return false;
        if (!h) return true;
        var vse = nazevVlakna(r.klic) + ' ' + r.misto.kde + ' ' + r.misto.bod + ' ' +
          r.zaznam.zpravy.map(function (z) { return z.text; }).join(' ');
        return bezDiakritiky(vse).indexOf(h) >= 0;
      }).sort(function (a, b) {
        return (b.zaznam.zmeneno || 0) - (a.zaznam.zmeneno || 0);
      });

      if (!radky.length) {
        vypis.appendChild(el('p', 'prazdno', 'Nic takového jsi neřešil.'));
        return;
      }

      var druh = null;
      radky.forEach(function (r) {
        if (r.misto.druh !== druh && !h) {
          druh = r.misto.druh;
          vypis.appendChild(el('h2', 'cast',
            druh === 'tema' ? 'Mimo insolvenční zákon' : 'Insolvenční zákon'));
        }
        var b = el('button', 'radek radek-vlakno');
        b.type = 'button';
        var levo = el('span');
        levo.appendChild(el('span', 'vlakno-nazev', nazevVlakna(r.klic)));
        levo.appendChild(el('span', 'vlakno-kde',
          r.misto.kde + (r.misto.bod ? ' · ' + r.misto.bod : '')));
        b.appendChild(levo);
        b.appendChild(el('span', 'radek-pramen', r.zaznam.zpravy.length + ' zpráv'));
        b.addEventListener('click', function () { skocNaVlakno(r.klic, r.misto); });
        vypis.appendChild(b);
      });
    }

    var casovac;
    hledaci.addEventListener('input', function () {
      clearTimeout(casovac);
      casovac = setTimeout(function () { prekresli(hledaci.value); }, 120);
    });
    prekresli('');
  }

  /** Skočí na místo, kde vlákno vzniklo, a otevře ho. */
  function skocNaVlakno(klic, misto) {
    cekaNaOtevreni = klic;
    if (location.hash === misto.hash) smeruj();
    else location.hash = misto.hash;
  }

  var cekaNaOtevreni = null;

  /** Po vykreslení stránky otevře vlákno, na které se skočilo z přehledu. */
  function dootevri() {
    if (!cekaNaOtevreni) return;
    var hledany = cekaNaOtevreni;
    cekaNaOtevreni = null;
    for (var i = 0; i < zivePrepinace.length; i += 1) {
      if (zivePrepinace[i].klicMista === hledany) {
        zivePrepinace[i].otevri();
        return;
      }
    }
  }
  /* ---- témata mimo insolvenční zákon ------------------------------------
     Zkouška se neptá jen na insolvenční zákon. Tahle část drží témata ze
     zákona o obchodních korporacích a z občanského zákoníku, která do
     insolvenční praxe zasahují nejvíc — psaná stejně jako výklad, tedy přes
     to, co s nimi správce dělá, a vždy s ověřeným paragrafem. */

  function tematPodleId(id) {
    for (var i = 0; i < TEMATA.length; i += 1) if (TEMATA[i].id === id) return TEMATA[i];
    return null;
  }

  function kontextTematu(t, bod) {
    return [
      'Jsi asistent pro přípravu na obecnou zkoušku insolvenčního správce v ČR.',
      'Uživatel čte výklad k tématu, které leží mimo insolvenční zákon, ale do',
      'insolvenční praxe zasahuje. Ptá se na konkrétní bod toho výkladu.',
      '',
      'Odpovídej česky, stručně a prakticky — v rovině toho, co to znamená pro',
      'práci insolvenčního správce. Kde si nejsi jistý, řekni to.',
      'Neuváděj paragrafy, které si nepamatuješ přesně.',
      'Nepiš úvodní zdvořilosti, jdi rovnou k věci.',
      '',
      '--- TÉMA ---',
      t.oblast + ' — ' + t.nazev,
      'Prameny: ' + t.pramen,
      '',
      '--- BOD, KTERÝ UŽIVATEL PRÁVĚ ČETL ---',
      bod.nadpis,
      bod.text,
      '--- KONEC KONTEXTU ---'
    ].join('\n');
  }

  function vykresliTema(id) {
    var t = tematPodleId(id);
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaStav.textContent = '';

    if (!t) {
      listaNazev.textContent = 'Téma není';
      hlavni.appendChild(el('p', 'prazdno', 'Takové téma tu není.'));
      return;
    }

    listaNazev.textContent = t.nazev;
    hlavni.appendChild(el('div', 'p-cislo', t.oblast));
    hlavni.appendChild(el('h1', 'p-nazev', t.nazev));
    hlavni.appendChild(el('p', 'drobecky', t.pramen));

    t.body.forEach(function (bod, i) {
      var blok = el('section', 'odstavec');
      blok.appendChild(el('h2', 'bod-nadpis', bod.nadpis));
      var karta = el('div', 'vyklad');
      vlozText(karta, bod.text);
      blok.appendChild(karta);
      var r = rozhovorProMisto(
        't-' + t.id + '-' + i,
        kontextTematu(t, bod),
        t.nazev + ' · ' + bod.nadpis
      );
      zivePrepinace.push(r);
      blok.appendChild(r);
      hlavni.appendChild(blok);
    });

    var i2 = TEMATA.indexOf(t);
    var prechod = el('div', 'prechod');
    var dozadu = el('button');
    dozadu.type = 'button';
    if (i2 > 0) {
      dozadu.textContent = '← ' + TEMATA[i2 - 1].nazev;
      dozadu.addEventListener('click', function () { location.hash = '#t' + TEMATA[i2 - 1].id; });
    } else {
      dozadu.style.visibility = 'hidden';
      dozadu.textContent = '—';
    }
    prechod.appendChild(dozadu);
    if (i2 < TEMATA.length - 1) {
      var dopredu = el('button');
      dopredu.type = 'button';
      dopredu.textContent = TEMATA[i2 + 1].nazev + ' →';
      dopredu.addEventListener('click', function () { location.hash = '#t' + TEMATA[i2 + 1].id; });
      prechod.appendChild(dopredu);
    }
    hlavni.appendChild(prechod);
    window.scrollTo(0, 0);
    dootevri();
  }

  /* ---- paragraf ------------------------------------------------------- */

  var zivePrepinace = [];

  /** Dá vědět rozhovorům na obrazovce, že se uložená data nebo stav změnily. */
  function ozviSeVlaknum() {
    zivePrepinace.forEach(function (r) { r.obnov(); });
  }

  function vykresliParagraf(cislo) {
    var p = podleCisla[cislo];
    hlavni.textContent = '';
    zivePrepinace = [];
    zpetBtn.hidden = false;
    listaStav.textContent = '';

    if (!p) {
      listaNazev.textContent = 'Paragraf není';
      hlavni.appendChild(el('p', 'prazdno', 'Takový paragraf v zákoně není.'));
      return;
    }

    listaNazev.textContent = '§ ' + p.paragraf;

    if (p.nazev) {
      hlavni.appendChild(el('div', 'p-cislo', '§ ' + p.paragraf));
      hlavni.appendChild(el('h1', 'p-nazev', p.nazev));
    } else {
      hlavni.appendChild(el('h1', 'p-nazev', '§ ' + p.paragraf));
    }
    hlavni.appendChild(el('p', 'drobecky',
      [p.cast, p.hlava, p.dil, p.oddil].filter(Boolean).join(' · ')));

    p.odstavce.forEach(function (o) {
      var blok = el('section', 'odstavec');

      var zneni = el('p', 'zneni');
      if (o.cislo) zneni.appendChild(el('span', 'zneni-cislo', '(' + o.cislo + ') '));
      zneni.appendChild(document.createTextNode(o.text));
      blok.appendChild(zneni);

      var v = vykladOdstavce(p, o);
      if (v) {
        var karta = el('div', 'vyklad');
        karta.appendChild(el('div', 'stitek', 'V praxi'));
        vlozText(karta, v);
        blok.appendChild(karta);
      } else {
        blok.appendChild(el('p', 'chybi', 'Výklad k tomuhle odstavci ještě nemám.'));
      }

      var r = rozhovorProMisto(
        klicDiskuze(p, o),
        kontext(p, o, v),
        '§ ' + p.paragraf + (o.cislo ? ' odst. ' + o.cislo : '') +
          (p.nazev ? ' — ' + p.nazev : '')
      );
      zivePrepinace.push(r);
      blok.appendChild(r);

      hlavni.appendChild(blok);
    });

    var i = ZAKON.indexOf(p);
    var prechod = el('div', 'prechod');
    var dozadu = el('button');
    dozadu.type = 'button';
    if (i > 0) {
      dozadu.textContent = '← § ' + ZAKON[i - 1].paragraf;
      dozadu.addEventListener('click', function () {
        location.hash = '#p' + ZAKON[i - 1].paragraf;
      });
    } else {
      dozadu.style.visibility = 'hidden';
      dozadu.textContent = '—';
    }
    prechod.appendChild(dozadu);
    if (i < ZAKON.length - 1) {
      var dopredu = el('button');
      dopredu.type = 'button';
      dopredu.textContent = '§ ' + ZAKON[i + 1].paragraf + ' →';
      dopredu.addEventListener('click', function () {
        location.hash = '#p' + ZAKON[i + 1].paragraf;
      });
      prechod.appendChild(dopredu);
    }
    hlavni.appendChild(prechod);
    window.scrollTo(0, 0);
    dootevri();
  }

  /* ---- tisk ------------------------------------------------------------
     Na papír se nevykresluje obrazovka, ale vlastní dokument — jinak by se
     tisklo i to, co je sbalené, a chybělo by to, co je uložené jinde než
     v právě otevřeném paragrafu. Rozhovory se proto před tiskem dotáhnou
     z úložiště pro všechny paragrafy, které se mají tisknout. */

  var tiskMisto = document.getElementById('tisk-misto');
  var tiskCil = document.getElementById('tisk');
  var tiskBtn = document.getElementById('tisk-tlacitko');
  var tiskPanel = null;

  function maVyklad(p) { return vylozeno(p) > 0; }

  /** Všechny uložené rozhovory, jako {"36-5": [zprávy]}. */
  function vsechnyRozhovory() {
    var mapa = {};
    Object.keys(ulozeni.vlakna).forEach(function (k) {
      var z = ulozeni.vlakna[k];
      if (z && z.zpravy && z.zpravy.length) mapa[k] = z;
    });
    return mapa;
  }

  function maNejakyRozhovor() { return Object.keys(vsechnyRozhovory()).length > 0; }

  function tiskniParagraf(p, rozhovory, sRozhovory) {
    var sekce = el('section', 't-paragraf');
    sekce.appendChild(el('div', 't-paragraf-cislo', '§ ' + p.paragraf));
    if (p.nazev) sekce.appendChild(el('h2', 't-paragraf-nazev', p.nazev));
    sekce.appendChild(el('div', 't-drobecky',
      [p.cast, p.hlava, p.dil, p.oddil].filter(Boolean).join(' · ')));

    p.odstavce.forEach(function (o) {
      var blok = el('div', 't-odstavec');

      var zneni = el('p', 't-zneni');
      if (o.cislo) zneni.appendChild(el('span', 't-zneni-cislo', '(' + o.cislo + ') '));
      zneni.appendChild(document.createTextNode(o.text));
      blok.appendChild(zneni);

      var v = vykladOdstavce(p, o);
      if (v) {
        var karta = el('div', 't-vyklad');
        karta.appendChild(el('span', 't-stitek', 'V praxi'));
        vlozText(karta, v);
        blok.appendChild(karta);
      }

      var vl = sRozhovory ? rozhovory[klicDiskuze(p, o)] : null;
      if (vl && vl.zpravy.length) {
        var vlakno = el('div', 't-rozhovor');
        vlakno.appendChild(el('span', 't-stitek',
          'Můj rozhovor: ' + (vl.nazev || odvozenyNazev(vl.zpravy))));
        vl.zpravy.forEach(function (z) {
          var b = el('div', 't-bublina ' + (z.role === 'user' ? 'ja' : 'claude'));
          b.appendChild(el('div', 't-kdo', z.role === 'user' ? 'Já' : 'Claude'));
          vlozText(b, z.text);
          vlakno.appendChild(b);
        });
        blok.appendChild(vlakno);
      }

      sekce.appendChild(blok);
    });
    return sekce;
  }

  function tiskniTema(t, rozhovory, sRozhovory) {
    var sekce = el('section', 't-paragraf');
    sekce.appendChild(el('div', 't-paragraf-cislo', t.oblast));
    sekce.appendChild(el('h2', 't-paragraf-nazev', t.nazev));
    sekce.appendChild(el('div', 't-drobecky', t.pramen));

    t.body.forEach(function (bod, i) {
      var blok = el('div', 't-odstavec');
      blok.appendChild(el('h3', 't-bod-nadpis', bod.nadpis));
      var karta = el('div', 't-vyklad');
      vlozText(karta, bod.text);
      blok.appendChild(karta);

      var vl = sRozhovory ? rozhovory['t-' + t.id + '-' + i] : null;
      if (vl && vl.zpravy.length) {
        var vlakno = el('div', 't-rozhovor');
        vlakno.appendChild(el('span', 't-stitek',
          'Můj rozhovor: ' + (vl.nazev || odvozenyNazev(vl.zpravy))));
        vl.zpravy.forEach(function (z) {
          var b = el('div', 't-bublina ' + (z.role === 'user' ? 'ja' : 'claude'));
          b.appendChild(el('div', 't-kdo', z.role === 'user' ? 'Já' : 'Claude'));
          vlozText(b, z.text);
          vlakno.appendChild(b);
        });
        blok.appendChild(vlakno);
      }
      sekce.appendChild(blok);
    });
    return sekce;
  }

  function vytiskni(paragrafy, sRozhovory, popisRozsahu, temata) {
    var rozhovory = vsechnyRozhovory();
    return Promise.resolve().then(function () {
      tiskCil.textContent = '';

      var hlavicka = el('header', 't-hlavicka');
      hlavicka.appendChild(el('div', 't-nadpis', 'Insolvenční zákon v praxi'));
      hlavicka.appendChild(el('div', 't-podnadpis',
        'Zákon č. 182/2006 Sb., znění podle Sbírky · ' + popisRozsahu +
        ' · vytištěno ' + new Date().toLocaleDateString('cs-CZ')));
      tiskCil.appendChild(hlavicka);

      (temata || []).forEach(function (t) {
        tiskCil.appendChild(tiskniTema(t, rozhovory, sRozhovory));
      });
      paragrafy.forEach(function (p) {
        tiskCil.appendChild(tiskniParagraf(p, rozhovory, sRozhovory));
      });

      tiskCil.appendChild(el('div', 't-patka',
        'Výklad je neoficiální a slouží k přípravě na zkoušku insolvenčního ' +
        'správce; závazné je jen znění předpisu.'));

      // Prohlížeč musí stihnout dokument složit, než otevře náhled.
      return new Promise(function (hotovo) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.print();
            hotovo();
          });
        });
      });
    });
  }

  function zavriPanel() {
    if (tiskPanel) { tiskPanel.remove(); tiskPanel = null; }
  }

  function otevriTiskPanel() {
    if (tiskPanel) { zavriPanel(); return; }

    var h = location.hash.replace(/^#/, '');
    var otevreny = h.indexOf('p') === 0 ? podleCisla[h.slice(1)] : null;
    var sVykladem = ZAKON.filter(maVyklad);
    var odstavcuSVykladem = 0;
    sVykladem.forEach(function (p) { odstavcuSVykladem += p.odstavce.length; });

    tiskPanel = el('div', 'tisk-panel');
    tiskPanel.appendChild(el('div', 'stitek', 'Co vytisknout'));

    var volby = [];
    function pridejVolbu(hodnota, popis, kolik, vychozi) {
      var l = el('label', 'tisk-volba');
      var r = document.createElement('input');
      r.type = 'radio';
      r.name = 'tisk-rozsah';
      r.value = hodnota;
      r.checked = !!vychozi;
      l.appendChild(r);
      var t = el('span');
      t.appendChild(document.createTextNode(popis + ' '));
      t.appendChild(el('span', 'kolik', kolik));
      l.appendChild(t);
      tiskPanel.appendChild(l);
      volby.push(r);
    }

    if (otevreny) {
      pridejVolbu('tento', 'Tento paragraf',
        '§ ' + otevreny.paragraf + ' · ' + otevreny.odstavce.length + ' odst.', true);
    }
    pridejVolbu('vyklad', 'Vše, k čemu je výklad',
      sVykladem.length + ' paragrafů · ' + odstavcuSVykladem + ' odst.', !otevreny);
    pridejVolbu('vse', 'Celý zákon',
      ZAKON.length + ' paragrafů · dlouhé', false);
    if (TEMATA.length) {
      var boduCelkem = 0;
      TEMATA.forEach(function (t) { boduCelkem += t.body.length; });
      pridejVolbu('temata', 'Mimo insolvenční zákon',
        TEMATA.length + ' témat · ' + boduCelkem + ' bodů', false);
    }

    var lb = el('label', 'tisk-volba');
    var zaskrt = document.createElement('input');
    zaskrt.type = 'checkbox';
    var jsouRozhovory = maNejakyRozhovor();
    zaskrt.checked = jsouRozhovory;
    zaskrt.disabled = !jsouRozhovory;
    lb.appendChild(zaskrt);
    lb.appendChild(el('span', null, jsouRozhovory
      ? 'Včetně mých rozhovorů s Claudem'
      : 'Zatím nemáš u žádného odstavce rozhovor'));
    tiskPanel.appendChild(lb);

    var akce = el('div', 'tisk-akce');
    var ok = el('button', 'poslat');
    ok.type = 'button';
    ok.textContent = 'Vytisknout';
    var zrus = el('button', 'drobny');
    zrus.type = 'button';
    zrus.textContent = 'Zavřít';
    akce.appendChild(ok);
    akce.appendChild(zrus);
    tiskPanel.appendChild(akce);

    ok.addEventListener('click', function () {
      var rozsah = 'vyklad';
      volby.forEach(function (r) { if (r.checked) rozsah = r.value; });
      var sada, popis, temata = null;
      if (rozsah === 'temata') {
        sada = [];
        temata = TEMATA;
        popis = 'mimo insolvenční zákon';
      } else if (rozsah === 'tento' && otevreny) {
        sada = [otevreny];
        popis = '§ ' + otevreny.paragraf;
      } else if (rozsah === 'vse') {
        sada = ZAKON;
        popis = 'celý zákon';
      } else {
        sada = sVykladem;
        popis = 'paragrafy s výkladem';
      }
      ok.disabled = true;
      ok.textContent = 'Připravuju…';
      vytiskni(sada, zaskrt.checked, popis, temata).then(function () {
        ok.disabled = false;
        ok.textContent = 'Vytisknout';
        zavriPanel();
      });
    });
    zrus.addEventListener('click', zavriPanel);

    tiskMisto.appendChild(tiskPanel);
  }

  tiskBtn.addEventListener('click', otevriTiskPanel);
  document.getElementById('rozhovory-tlacitko').addEventListener('click', function () {
    location.hash = '#rozhovory';
  });

  /* ---- směrování ------------------------------------------------------ */

  function smeruj() {
    zavriPanel();
    var h = location.hash.replace(/^#/, '');
    if (h === 'rozhovory') vykresliRozhovory();
    else if (h.indexOf('t') === 0) vykresliTema(h.slice(1));
    else if (h.indexOf('p') === 0) vykresliParagraf(h.slice(1));
    else vykresliObsah('');
  }

  zpetBtn.addEventListener('click', function () {
    if (history.length > 1) history.back();
    else location.hash = '';
  });
  window.addEventListener('hashchange', smeruj);
  smeruj();

  /* ---- schopnosti ----------------------------------------------------- */

  nastartujUlozeni();

  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(function (s) {
      sample = s;
      zivePrepinace.forEach(function (r) { r.prepni(); });
    }, function () {});
  }
})();
</script>
